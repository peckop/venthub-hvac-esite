<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Hood Visualization Final (V11 - 3-View Verified)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 1;
        }

        #tour-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #333;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            font-family: sans-serif;
            z-index: 1;
        }
    </style>
    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">Industrial Hood V11 - Full Box & Corrected Slope</div>
    <button id="tour-btn">Stop Camera Tour</button>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        // TWEEN import removed to prevent loading errors

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 5, 20);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Initial Position (Perspective)
        camera.position.set(2.0, 1.2, 2.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.3, 0); // Look at center of hood height

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(5, 5, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0xffaa00, 0.4);
        fillLight.position.set(-2, 0, 2);
        scene.add(fillLight);

        // Materials
        const steelMaterial = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            metalness: 0.85,
            roughness: 0.25,
            side: THREE.DoubleSide
        });

        const filterMaterial = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            metalness: 0.7,
            roughness: 0.3
        });

        const darkSteelMaterial = new THREE.MeshStandardMaterial({
            color: 0x555555,
            metalness: 0.8,
            roughness: 0.4
        });

        // --- V11 HOOD GEOMETRY ---
        const hoodGroup = new THREE.Group();
        scene.add(hoodGroup);

        // Dimensions
        const width = 2.0;
        const depth = 1.1;
        const height = 0.6;
        const thickness = 0.002; // 2mm steel sheet

        // 1. MAIN SHELL (Full Box)
        // Top
        const topPanel = new THREE.Mesh(new THREE.BoxGeometry(width, thickness, depth), steelMaterial);
        topPanel.position.y = height;
        topPanel.castShadow = true;
        hoodGroup.add(topPanel);

        // Back
        const backPanel = new THREE.Mesh(new THREE.BoxGeometry(width, height, thickness), steelMaterial);
        backPanel.position.set(0, height / 2, -depth / 2 + thickness / 2);
        backPanel.castShadow = true;
        hoodGroup.add(backPanel);

        // Sides
        const sideGeo = new THREE.BoxGeometry(thickness, height, depth);
        const leftPanel = new THREE.Mesh(sideGeo, steelMaterial);
        leftPanel.position.set(-width / 2 + thickness / 2, height / 2, 0);
        hoodGroup.add(leftPanel);

        const rightPanel = new THREE.Mesh(sideGeo, steelMaterial);
        rightPanel.position.set(width / 2 - thickness / 2, height / 2, 0);
        hoodGroup.add(rightPanel);

        // Front (FULL HEIGHT)
        const frontPanel = new THREE.Mesh(new THREE.BoxGeometry(width, height, thickness), steelMaterial);
        frontPanel.position.set(0, height / 2, depth / 2 - thickness / 2);
        hoodGroup.add(frontPanel);


        // 2. INTERNAL GEOMETRY
        // A. Light Panel (Horizontal Shelf at Bottom-Front)
        const lightPanelDepth = 0.35;
        const lightPanelY = 0.02; // Slightly up from 0 to avoid Z-fighting with hypothetical floor? No, just thickness.

        const lightPanel = new THREE.Mesh(new THREE.BoxGeometry(width, thickness, lightPanelDepth), steelMaterial);
        // Position: Flush with Front Panel inner surface
        // Front Panel Z inner = depth/2 - thickness
        // Light Panel Center Z = (depth/2 - thickness) - lightPanelDepth/2
        const lpZ = (depth / 2 - thickness) - lightPanelDepth / 2;
        lightPanel.position.set(0, lightPanelY, lpZ);
        hoodGroup.add(lightPanel);

        // B. Filter Bank
        // Starts at Back Edge of Light Panel
        const bottomRailY = lightPanelY;
        const bottomRailZ = (depth / 2 - thickness) - lightPanelDepth; // Exact edge

        // Ends at Top of Back Wall
        const topRailY = height - 0.05;
        const topRailZ = -depth / 2 + 0.05; // Against back wall

        // Calculate Filter Angle and Length
        const dy = topRailY - bottomRailY;
        const dz = bottomRailZ - topRailZ;
        const filterLen = Math.sqrt(dy * dy + dz * dz);
        const filterAngle = Math.atan2(dy, dz);

        const slopeRotation = filterAngle;

        // C. Top Rail (U-Channel)
        const topRail = new THREE.Mesh(new THREE.BoxGeometry(width, 0.05, 0.05), steelMaterial);
        topRail.position.set(0, topRailY, topRailZ);
        hoodGroup.add(topRail);

        // D. Bottom Rail / Grease Trough
        const gutterGeo = new THREE.BoxGeometry(width, 0.05, 0.10);
        const gutter = new THREE.Mesh(gutterGeo, steelMaterial);
        // Center of gutter should align with filter bottom edge
        gutter.position.set(0, bottomRailY, bottomRailZ);
        hoodGroup.add(gutter);

        // E. Side Cheeks (Internal Plenum Walls)
        // Triangle from (Top-Back) to (Bottom-Front)
        const cheekShape = new THREE.Shape();
        cheekShape.moveTo(0, 0); // Top-Back (Relative)
        cheekShape.lineTo(dz, -dy); // Bottom-Front
        cheekShape.lineTo(dz, 0); // Top-Front (at Top Rail Height)
        cheekShape.lineTo(0, 0); // Close

        const cheekGeo = new THREE.ExtrudeGeometry(cheekShape, { depth: thickness, bevelEnabled: false });

        const leftCheek = new THREE.Mesh(cheekGeo, steelMaterial);
        leftCheek.rotation.y = -Math.PI / 2;
        leftCheek.position.set(-width / 2 + thickness + 0.01, topRailY, topRailZ); // Just inside left wall
        hoodGroup.add(leftCheek);

        const rightCheek = new THREE.Mesh(cheekGeo, steelMaterial);
        rightCheek.rotation.y = -Math.PI / 2;
        rightCheek.position.set(width / 2 - thickness - 0.01 - thickness, topRailY, topRailZ); // Just inside right wall
        hoodGroup.add(rightCheek);


        // 3. BAFFLE FILTERS
        const numFilters = 4;
        const fWidth = 0.49;
        const fHeight = filterLen;
        const fThick = 0.04;

        const filterGroup = new THREE.Group();
        filterGroup.position.set(0, (topRailY + bottomRailY) / 2, (topRailZ + bottomRailZ) / 2);
        filterGroup.rotation.x = slopeRotation;
        hoodGroup.add(filterGroup);

        const baffleGeo = new THREE.BoxGeometry(fWidth, fHeight, fThick);

        for (let i = 0; i < numFilters; i++) {
            const f = new THREE.Mesh(baffleGeo, filterMaterial);
            const xPos = (i - (numFilters - 1) / 2) * (fWidth + 0.005);
            f.position.set(xPos, 0, 0);

            // VERTICAL BAFFLES
            const slatGeo = new THREE.BoxGeometry(0.03, fHeight - 0.02, fThick + 0.01);
            const numSlats = 6;
            for (let k = 0; k < numSlats; k++) {
                const slat = new THREE.Mesh(slatGeo, steelMaterial);
                const sX = (k - (numSlats - 1) / 2) * 0.07;
                slat.position.set(sX, 0, 0);
                f.add(slat);
            }

            // HANDLES
            const handleGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.15, 16);
            const handleMat = darkSteelMaterial;

            const h1 = new THREE.Mesh(handleGeo, handleMat);
            h1.rotation.x = Math.PI / 2;
            h1.position.set(-0.1, 0, fThick / 2 + 0.02);
            f.add(h1);

            const h2 = new THREE.Mesh(handleGeo, handleMat);
            h2.rotation.x = Math.PI / 2;
            h2.position.set(0.1, 0, fThick / 2 + 0.02);
            f.add(h2);

            // Frame border
            const frameTop = new THREE.Mesh(new THREE.BoxGeometry(fWidth, 0.02, fThick + 0.005), steelMaterial);
            frameTop.position.y = fHeight / 2;
            f.add(frameTop);

            const frameBottom = new THREE.Mesh(new THREE.BoxGeometry(fWidth, 0.02, fThick + 0.005), steelMaterial);
            frameBottom.position.y = -fHeight / 2;
            f.add(frameBottom);

            filterGroup.add(f);
        }

        // 4. EXHAUST DUCT
        const ductGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.3, 32);
        const duct = new THREE.Mesh(ductGeo, steelMaterial);
        duct.position.set(0, height + 0.1, -depth / 2 + 0.2);
        hoodGroup.add(duct);


        // 5. LIGHTS
        const lightGeo = new THREE.BoxGeometry(0.15, 0.02, 0.15);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        for (let i = 0; i < 4; i++) {
            const lightMesh = new THREE.Mesh(lightGeo, lightMat);
            const lx = (i - 1.5) * 0.4;
            lightMesh.position.set(lx, lightPanelY - 0.01, lpZ);
            hoodGroup.add(lightMesh);

            const ptLight = new THREE.PointLight(0xffffff, 0.5, 2);
            ptLight.position.set(lx, lightPanelY - 0.1, lpZ);
            hoodGroup.add(ptLight);
        }

        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.5;
        scene.add(floor);

        // --- AUTOMATED CAMERA TOUR ---
        let tourActive = true;
        const tourBtn = document.getElementById('tour-btn');
        tourBtn.addEventListener('click', () => {
            tourActive = !tourActive;
            tourBtn.textContent = tourActive ? "Stop Camera Tour" : "Start Camera Tour";
        });

        let time = 0;

        function updateCameraTour() {
            if (!tourActive) return;

            time += 0.005;
            const cycle = time % 4; // 4 phases

            // Interpolate positions
            let targetPos = new THREE.Vector3();

            if (cycle < 1) {
                // Phase 1: Perspective Orbit
                const angle = cycle * Math.PI / 2;
                targetPos.set(2.5 * Math.cos(angle), 1.2, 2.5 * Math.sin(angle));
            } else if (cycle < 2) {
                // Phase 2: Front View
                // Smooth transition to (0, 0.3, 3.0)
                const t = cycle - 1;
                targetPos.set(0, 0.3, 3.0);
            } else if (cycle < 3) {
                // Phase 3: Side View
                // Smooth transition to (3.0, 0.3, 0)
                const t = cycle - 2;
                targetPos.set(3.0, 0.3, 0);
            } else {
                // Phase 4: Bottom View (Looking up)
                // Smooth transition to (0, -1.5, 1.0) looking at (0, 0.3, 0)
                const t = cycle - 3;
                targetPos.set(0, -1.0, 1.5);
            }

            // Simple lerp for smoothness
            camera.position.lerp(targetPos, 0.05);
        }

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            updateCameraTour();
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
