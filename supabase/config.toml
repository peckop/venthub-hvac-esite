# Supabase project configuration
# Edge Function settings
#
# KURAL: `verify_jwt = false` YALNIZCA çağıranı JWT gönderemeyen uçlar içindir
# (harici webhook, pg_cron). Burada listelenmeyen her fonksiyon varsayılan `true` alır.
# 2026-08-14 ölçümü: bu dosya prod ile 3 yerde ÇELİŞİYORDU (admin-orders-latest prod'da
# true ama burada false → deploy korumayı DÜŞÜRECEKTİ). Değiştirmeden önce prod'daki
# gerçek değeri `mcp__supabase__list_edge_functions` ile doğrula.

[functions]

# --- Harici çağıran: JWT gönderemez, false ZORUNLU ---

[functions."iyzico-callback"]
verify_jwt = false          # iyzico ödeme sağlayıcısı çağırıyor

[functions."returns-webhook"]
verify_jwt = false          # kargo/iade firması webhook'u (gövdede HMAC + replay guard var)

# --- Admin uçları: src'de tarayıcı çağıranı YOK ya da oturumlu admin çağırıyor.
# Gövdede tam kimlik+rol kapısı var; kapı JWT bekliyor, dolayısıyla geçit de zorlamalı.
# 2026-08-14'te dördü de false'tan true'ya alındı (prod'da 4 canlı yetkisiz-erişim vardı). ---

[functions."refund-order-mock"]
verify_jwt = true           # ReturnsTableBody.tsx:342/:438 — oturumlu admin tarayıcısı

[functions."admin-update-order"]
verify_jwt = true           # src'de çağıran yok (operasyonel uç)

[functions."admin-order-inspect"]
verify_jwt = true           # src'de çağıran yok (operasyonel uç)

[functions."admin-orders-latest"]
verify_jwt = true           # prod ZATEN true idi; buradaki false bir çelişkiydi

[functions."admin-iyzico-reconcile"]
verify_jwt = true           # src'de çağıran yok (operasyonel uç)

[functions."shipping-webhook"]
verify_jwt = false

[functions."shipping-status"]
verify_jwt = false

# T026-VH Adım 3 (2026-08-15): bu üçü SINIF (a+b) — sunucu→sunucu service_role VE
# oturumlu admin tarayıcısı çağırıyor. İkisi de geçerli bir JWT taşır, yani `false`
# olmaları hiçbir zaman gerekli değildi; §3.1 ihlaliydi ve geçidi herkese açık
# bırakıyordu. Kapı artık `_shared/caller.ts::resolveCaller` ile gövdede de var.
# Yön kontrolü (§3.7): prod'da ÜÇÜ DE `false` ölçüldü → bu değişiklik deploy edilince
# korumayı DÜŞÜRMEZ, SIKILAŞTIRIR.
# Çağıranlar doğrulandı: order-confirmation ← iyzico-callback (service_role);
# return-status-notification ← returns-webhook (service_role) + admin paneli
# (ReturnsTableBody.tsx, oturumlu JWT); shipping-notification ← admin-update-shipping
# (service_role).
[functions."shipping-notification"]
verify_jwt = true

[functions."order-confirmation"]
verify_jwt = true

[functions."return-status-notification"]
verify_jwt = true

[functions."tcmb-rates-sync"]
verify_jwt = false
