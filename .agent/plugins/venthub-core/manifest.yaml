name: venthub-core
version: 1.0.0
description: "VentHub Core Developer & Quality Plugin - LLM Ajanları için Entegre Geliştirme ve Kalite Rehberleri"
rules:
  evidence_required: true      # Hiçbir denetim (röntgen, audit vb.) aracı terminal log kanıtı olmadan onay veremez
  prerequisite_check: true     # Her adımdan önce project-dna.yaml okunmalıdır
  critical_asset_protection: true # protected_paths kapsamındaki dosyalara izinsiz/onaysız müdahale edilemez

skills:
  orchestration:
    - name: teamwork-director
      path: .agent/skills/teamwork-director/SKILL.md
      description: "Sprint planlama ve görev dağılım kılavuzu. project-dna.yaml'a göre kalite kontratı enjekte eder."
      triggers_on: ["takıma iş ver", "sprint başlat", "/teamwork-preview", "teamwork-preview"]
      inputs: ["project-dna.yaml", "user request"]
      outputs: ["prompt_draft.md"]
    
    - name: enterprise-multiagent
      path: .agent/skills/enterprise-multiagent/SKILL.md
      description: "Worker-Judge çoklu ajan koordinasyon motoru yönergesi."
      triggers_on: ["delegasyon", "multi-agent run", "sprint start"]
      inputs: ["prompt_draft.md"]
      outputs: ["code changes", "review verdict"]

    - name: multi-agent-research
      path: .agent/skills/multi-agent-research/SKILL.md
      description: "Araştırma ve mimari analiz alt ajan koordinasyon kılavuzu."
      triggers_on: ["kod tabanını araştır", "mimari analiz", "RAG research"]
      inputs: ["research query"]
      outputs: ["research_notes.md"]

  intelligence:
    - name: notebook-navigator
      path: .agent/skills/notebook-navigator/SKILL.md
      description: "NotebookLM dijital ikiz arama ve bilgi edinme rehberi."
      triggers_on: ["notebooklm query", "ikizden sorgula", "RAG query"]
      inputs: ["query string"]
      outputs: ["rag response text"]

    - name: notebooklm-sync
      path: .agent/skills/notebooklm-sync/SKILL.md
      description: "Markdown dokümantasyonunu NotebookLM ile eşitleme yönergesi."
      triggers_on: ["nlm sync", "defteri güncelle", "hafızayı yenile"]
      inputs: ["docs/*.md"]
      outputs: ["synced NotebookLM source"]
      prerequisites: ["nlm login (Terminal yetkisi expired olduğunda 'nlm login' çalıştırılmalıdır)"]

    - name: orion-cli
      path: .agent/skills/orion-cli/SKILL.md
      description: "Orion CLI komutları ve döküman üretim pipeline kılavuzu."
      triggers_on: ["orion doc", "doküman üret", "tree oluştur"]
      inputs: ["source code files"]
      outputs: ["docs/*.md"]
      prerequisites: ["OPENROUTER_API_KEY", "nlm login (NotebookLM sync için)"]

    - name: find-skills
      path: .agent/skills/find-skills/SKILL.md
      description: "Yeni yeteneklerin aranması ve keşfedilmesi kılavuzu."
      triggers_on: ["skill bul", "yetenek ara", "how do I do X"]
      inputs: ["skill query"]
      outputs: ["recommended skills list"]

  guards:
    - name: venthub-architecture
      path: .agent/skills/venthub-architecture/SKILL.md
      description: "React 19, Next.js 15, SSR, PPR ve mimari standartlar kılavuzu."
      triggers_on: ["yeni bileşen oluştur", "RSC render", "PPR config"]
      inputs: ["code design query"]
      outputs: ["architecture compliance guidelines"]

    - name: i18n-conventions
      path: .agent/skills/i18n-conventions/SKILL.md
      description: "Çok dilli sözlük, type-locking ve Routes proxy kullanım standartları."
      triggers_on: ["metin ekle", "çeviri yap", "i18n", "dictionary update"]
      inputs: ["JSX text string"]
      outputs: ["tr.ts / en.ts updates", "Routes usage"]

    - name: supabase-security
      path: .agent/skills/supabase-security/SKILL.md
      description: "SQL migration, multi-tenant RLS ve JWT claims RBAC kuralları."
      triggers_on: ["migration yaz", "policy oluştur", "RLS", "middleware redirect"]
      inputs: ["database schema change requests"]
      outputs: ["idempotent SQL migrations", "JWT claims validation code"]

    - name: supabase
      path: .agent/skills/supabase/SKILL.md
      description: "Supabase client factories ve Dependency Injection (DI) kuralları."
      triggers_on: ["supabase client", "servis yaz", "db query"]
      inputs: ["service code structure"]
      outputs: ["DI-compliant supabase client usages"]

    - name: ui-ux-pro-max
      path: .agent/skills/ui-ux-pro-max/SKILL.md
      description: "CSS HSL değişkenleri ve strict Tailwind arbitrary class yasağı."
      triggers_on: ["tasarım yap", "renk seç", "style fix", "Tailwind styling"]
      inputs: ["design query"]
      outputs: ["HSL css token definitions", "standard tailwind class recommendations"]

    - name: web-design-guidelines
      path: .agent/skills/web-design-guidelines/SKILL.md
      description: "Erişilebilirlik (WCAG 2.2 AA) ve web standartları denetim rehberi."
      triggers_on: ["erişilebilirlik denetle", "a11y check", "design guidelines check"]
      inputs: ["UI code files"]
      outputs: ["a11y compliance report"]

    - name: typography
      path: .agent/skills/typography/SKILL.md
      description: "Tipografi, okunabilirlik ve font hiyerarşisi standartları."
      triggers_on: ["font değiştir", "okunabilirlik", "text styling"]
      inputs: ["typography requirements"]
      outputs: ["type scale rules"]

    - name: vercel-composition-patterns
      path: .agent/skills/vercel-composition-patterns/SKILL.md
      description: "React bileşen kompozisyon ve kod mimarisi standartları."
      triggers_on: ["component refactor", "compound component design"]
      inputs: ["react component props structure"]
      outputs: ["clean react composition patterns"]

    - name: vercel-react-best-practices
      path: .agent/skills/vercel-react-best-practices/SKILL.md
      description: "Next.js/React performans optimizasyon ve render kuralları."
      triggers_on: ["performans optimize et", "waterfall fix", "RSC optimization"]
      inputs: ["react components code"]
      outputs: ["performance aligned components code"]

  audit:
    - name: venthub-auditor
      path: .agent/skills/venthub-auditor/SKILL.md
      description: "Bütünlük kalkanı (check_integrity.py) ve kritik varlık koruma denetimleri."
      triggers_on: ["integrity check", "bütünlük denetle", "pre-commit check"]
      inputs: ["working directory state"]
      outputs: ["integrity verification status"]

    - name: venthub-global-rontgen
      path: .agent/skills/venthub-global-rontgen/SKILL.md
      description: "Fiziki terminal komut kanıtlı radar linter/compiler tarama kılavuzu."
      triggers_on: ["rontgen", "radar", "global scan", "linter check"]
      inputs: ["project codebase"]
      outputs: ["rontgen-template.json log analysis"]

    - name: venthub-enterprise-audit
      path: .agent/skills/venthub-enterprise-audit/SKILL.md
      description: "Teslim öncesi L1-L12 Kalite Kapıları terminal denetim checklist'i."
      triggers_on: ["enterprise audit", "10/10 check", "sprint delivery check"]
      inputs: ["final codebase state"]
      outputs: ["L1-L12 pass/fail report"]

    - name: lighthouse-performance-guard
      path: .agent/skills/lighthouse-performance-guard/SKILL.md
      description: "Chrome DevTools Tracing ve Web Vitals performans regresyon kontrolü."
      triggers_on: ["lighthouse audit", "performance check", "web vitals check"]
      inputs: ["local web server page url"]
      outputs: ["tracing analysis report"]

    - name: fallow
      path: .agent/skills/fallow/SKILL.md
      description: "Dead-code, unused dependencies ve Next.js 15 PPR Suspense statik analizi."
      triggers_on: ["fallow run", "dead-code check", "unused dependencies check"]
      inputs: ["source files graph"]
      outputs: ["fallow health output report"]

    - name: diff-review
      path: .agent/skills/diff-review/SKILL.md
      description: "Git commit öncesi riskli kod kalıplarının (any, drop table vb.) denetimi."
      triggers_on: ["diff review", "commit check", "git diff check"]
      inputs: ["git diff output"]
      outputs: ["checks verdict (pass/fail)"]

    - name: performance-alignment
      path: .agent/skills/performance-alignment/SKILL.md
      description: "NotebookLM ile otonom performans ve RAG analiz koordinasyonu."
      triggers_on: ["performans planı", "RAG performance alignment"]
      inputs: ["performance trace logs"]
      outputs: ["performance alignment plan"]

    - name: venthub-catalog-importer
      path: .agent/skills/venthub-catalog-importer/SKILL.md
      description: "HVAC PDF katalog verilerinin otonom taranması ve doğrulanması."
      triggers_on: ["katalog oku", "pdf scan", "hvac catalog import"]
      inputs: ["catalog pdf files"]
      outputs: ["validated catalog data JSON"]

  utils:
    - name: git-commit
      path: .agent/skills/git-commit/SKILL.md
      description: "Conventional Commit standartları ve akıllı staging rehberi."
      triggers_on: ["commit yap", "/commit", "conventional commit"]
      inputs: ["staged changes diff"]
      outputs: ["formatted git commit message"]

    - name: to-issues
      path: .agent/skills/to-issues/SKILL.md
      description: "Geliştirme planlarının bağımsız iş listelerine dönüştürülmesi."
      triggers_on: ["issue oluştur", "planı böl", "tasks to issues"]
      inputs: ["approved implementation plan"]
      outputs: ["structured issues list"]

    - name: to-prd
      path: .agent/skills/to-prd/SKILL.md
      description: "Mevcut diyalog bağlamının PRD dökümanına dönüştürülmesi."
      triggers_on: ["prd üret", "prd oluştur", "chat to prd"]
      inputs: ["conversation transcript"]
      outputs: ["product requirements document"]
