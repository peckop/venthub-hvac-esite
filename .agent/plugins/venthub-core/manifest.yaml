name: venthub-core
version: 1.0.0
description: VentHub Core Developer & Quality Plugin - LLM Ajanları için Entegre Geliştirme
  ve Kalite Rehberleri
rules:
  evidence_required: true
  prerequisite_check: true
  critical_asset_protection: true
skills:
  orchestration:
  - name: enterprise-multiagent
    path: .agent/skills/enterprise-multiagent/SKILL.md
    description: Orchestrates specialized worker-judge multi-agent teams for VentHub
      HVAC developments complying with strict quality baselines. Trigger when delegating
      tasks, starting a sprint, or managing multi-agent runs. Do NOT use for database
      resets, general git branch creation, text formatting, or running unit tests
      directly.
    triggers_on:
    - delegasyon
    - multi-agent run
    - sprint start
    inputs:
    - prompt_draft.md
    outputs:
    - code changes
    - review verdict
    depends_on: []
    next_steps: []
    run_last: false
    exclusions:
    - multi-agent-research
  - name: multi-agent-research
    path: .agent/skills/multi-agent-research/SKILL.md
    description: Reusable worker-judge multi-agent orchestrator for high-quality codebase
      research, architectural analysis, design, and RAG technical verification. Trigger
      when analyzing the codebase, performing RAG research, or executing architectural
      reviews. Do NOT use for database resets, formatting, git branching, or running
      local unit tests.
    triggers_on:
    - kod tabanını araştır
    - mimari analiz
    - RAG research
    inputs:
    - research query
    outputs:
    - research_notes.md
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
  - name: skills-creator
    path: .agent/skills/skills-creator/SKILL.md
    description: Automatically creates, updates, and optimizes modular agent skills.
      Trigger for creating new skills (yeni skill oluştur, skill yarat/optimize et),
      adding capabilities (yetenek ekle/oluştur), or compiling the manifest. Do NOT
      use for database operations, font formatting, or running general unit tests.
    triggers_on:
    - yeni skill oluştur
    - skill yarat
    - skill optimize et
    - yetenek ekle
    - yetenek oluştur
    - skills-creator
    inputs:
    - skill name and requirements
    outputs:
    - modular skill folder under .agent/skills/
    - compiled manifest.yaml and master docs
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
    recovery:
    - If validation fails, check skills-evaluator.py logs or run the subagent optimizer
      again.
  - name: teamwork-director
    path: .agent/skills/teamwork-director/SKILL.md
    description: Teamwork-preview prompt hazırlama yöneticisi. "takıma iş ver", "sprint
      başlat", "/teamwork-preview" veya teamwork-preview istendiğinde zenginleştirilmiş
      prompt hazırlar ve takıma delege eder. Veritabanı sıfırlama, git branch oluşturma,
      birim testi çalıştırma veya metin formatlama durumlarında KULLANMAYIN.
    triggers_on:
    - takıma iş ver
    - sprint başlat
    - /teamwork-preview
    - teamwork-preview
    inputs:
    - project-dna.yaml
    - user request
    outputs:
    - prompt_draft.md
    depends_on:
    - to-issues
    next_steps:
    - enterprise-multiagent
    run_last: false
    exclusions: []
  intelligence:
  - name: find-skills
    path: .agent/skills/find-skills/SKILL.md
    description: Helps users search, discover, and install agent skills/capabilities
      based on queries like "how do I do X" or when they express interest in extending
      functionality. Do NOT use for general developer tasks like database reset, code
      formatting, git branch creation, or installing Node.js/tools on the host OS.
    triggers_on:
    - skill bul
    - yetenek ara
    - how do I do X
    inputs:
    - skill query
    outputs:
    - recommended skills list
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
  - name: notebook-navigator
    path: .agent/skills/notebook-navigator/SKILL.md
    description: Use this skill to identify NotebookLM IDs and execute conceptual,
      architectural, RAG, or research queries requiring deep external domain knowledge.
      DO NOT use for local code changes, unit testing, git branching, formatting markdown
      tables, or styling fonts.
    triggers_on:
    - notebooklm query
    - ikizden sorgula
    - RAG query
    inputs:
    - query string
    outputs:
    - rag response text
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
    recovery:
      on_auth_expired: powershell -ExecutionPolicy Bypass -File .agent/scripts/nlm-clean-login.ps1
  - name: notebooklm-sync
    path: .agent/skills/notebooklm-sync/SKILL.md
    description: Projedeki Markdown (.md) dosyalarını NotebookLM ile senkronize (nlm
      sync) etmek, defteri güncellemek ve hafızayı yenilemek için kullanılır (Hard
      Reset). Kullanıcı NotebookLM'de arama yapmak istediğinde ASLA tetiklemeyin.
      Veritabanı sıfırlama, git işlemleri veya linter çalıştırma amacıyla KULLANMAYIN.
    triggers_on:
    - nlm sync
    - defteri güncelle
    - hafızayı yenile
    inputs:
    - docs/*.md
    outputs:
    - synced NotebookLM source
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
    recovery:
      on_auth_expired: powershell -ExecutionPolicy Bypass -File .agent/scripts/nlm-clean-login.ps1
    prerequisites:
    - nlm login
  - name: orion-cli
    path: .agent/skills/orion-cli/SKILL.md
    description: Orion CLI dokümantasyon pipeline komutlarını öğretir, tree veya şema
      üretir. "doküman üret", "orion doc", veya "tree oluştur" istendiğinde tetikleyin.
      Kullanıcı sadece kod yazmak, debug yapmak, test çalıştırmak veya veritabanı/git
      işlemleri yapmak istediğinde ASLA tetiklemeyin.
    triggers_on:
    - orion doc
    - doküman üret
    - tree oluştur
    inputs:
    - source code files
    outputs:
    - docs/*.md
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
    recovery:
      on_auth_expired: powershell -ExecutionPolicy Bypass -File .agent/scripts/nlm-clean-login.ps1
    prerequisites:
    - OPENROUTER_API_KEY
    - nlm login (NotebookLM sync için)
  guards:
  - name: i18n-conventions
    path: .agent/skills/i18n-conventions/SKILL.md
    description: Defines internationalization (i18n) conventions for VentHub. Use
      when translating text, updating dictionary files, adding/modifying JSX labels,
      or performing i18n dictionary updates. Do NOT use for styling fonts, database
      operations, or running test suites.
    triggers_on:
    - metin ekle
    - çeviri yap
    - i18n
    - dictionary update
    inputs:
    - JSX text string
    outputs:
    - tr.ts / en.ts updates
    - Routes usage
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
  - name: supabase
    path: .agent/skills/supabase/SKILL.md
    description: Use when doing tasks involving Supabase products, client libraries,
      database client, writing services (servis yaz), or database queries (db query).
      Do NOT use for styling fonts, creating git branches, running unit tests, or
      formatting markdown tables.
    triggers_on:
    - supabase client
    - servis yaz
    - db query
    inputs:
    - service code structure
    outputs:
    - DI-compliant supabase client usages
    depends_on: []
    next_steps:
    - supabase-security
    run_last: false
    exclusions: []
  - name: supabase-security
    path: .agent/skills/supabase-security/SKILL.md
    description: Defines RLS policies, database migrations (migration yaz), policies
      (policy oluştur), and security redirection middleware (middleware redirect).
      Do NOT use for font/typography adjustments, creating git branches, running unit
      tests, or general text formatting.
    triggers_on:
    - migration yaz
    - policy oluştur
    - RLS
    - middleware redirect
    inputs:
    - database schema change requests
    outputs:
    - idempotent SQL migrations
    - JWT claims validation code
    depends_on:
    - supabase
    next_steps: []
    run_last: false
    exclusions: []
  - name: typography
    path: .agent/skills/typography/SKILL.md
    description: Applies typography principles for fonts, readability, text styling,
      type scales, and line spacing. Trigger for font modification (font değiştir),
      readability (okunabilirlik), or text styling. Do NOT use for general git operations,
      running unit tests, or database resets.
    triggers_on:
    - font değiştir
    - okunabilirlik
    - text styling
    inputs:
    - typography requirements
    outputs:
    - type scale rules
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
  - name: ui-ux-pro-max
    path: .agent/skills/ui-ux-pro-max/SKILL.md
    description: Provides UI/UX design recommendations, Tailwind styling, HSL colors,
      design patterns, and palettes. Trigger for UI design (tasarım yap), color selection
      (renk seç), styling fixes (style fix), and Tailwind styling. Do NOT use for
      git branch creation, running unit tests, or database resets.
    triggers_on:
    - tasarım yap
    - renk seç
    - style fix
    - Tailwind styling
    inputs:
    - design query
    outputs:
    - HSL css token definitions
    - standard tailwind class recommendations
    depends_on: []
    next_steps:
    - web-design-guidelines
    run_last: false
    exclusions: []
  - name: venthub-architecture
    path: .agent/skills/venthub-architecture/SKILL.md
    description: Defines VentHub architecture, component patterns, and Next.js App
      Router rules. Trigger for creating new components (yeni bileşen oluştur), React
      Server Components (RSC render), or PPR configuration (PPR config). Do NOT use
      for git commands, database resets, or running unit tests.
    triggers_on:
    - yeni bileşen oluştur
    - RSC render
    - PPR config
    inputs:
    - code design query
    outputs:
    - architecture compliance guidelines
    depends_on: []
    next_steps:
    - venthub-auditor
    run_last: false
    exclusions: []
  - name: vercel-composition-patterns
    path: .agent/skills/vercel-composition-patterns/SKILL.md
    description: React composition patterns that scale, including compound component
      design, context providers, and component refactoring. Trigger for component
      refactoring (component refactor) and compound component design. Do NOT use for
      general git operations, running unit tests, or database resets.
    triggers_on:
    - component refactor
    - compound component design
    inputs:
    - react component props structure
    outputs:
    - clean react composition patterns
    depends_on: []
    next_steps:
    - vercel-react-best-practices
    run_last: false
    exclusions: []
  - name: vercel-react-best-practices
    path: .agent/skills/vercel-react-best-practices/SKILL.md
    description: React and Next.js performance optimization guidelines from Vercel.
      Trigger for performance optimization (performans optimize et), waterfall fixes
      (waterfall fix), or RSC optimization. Do NOT use for git branch creation, database
      resets, or formatting markdown tables.
    triggers_on:
    - performans optimize et
    - waterfall fix
    - RSC optimization
    inputs:
    - react components code
    outputs:
    - performance aligned components code
    depends_on:
    - vercel-composition-patterns
    next_steps: []
    run_last: false
    exclusions: []
  - name: web-design-guidelines
    path: .agent/skills/web-design-guidelines/SKILL.md
    description: Reviews UI code for Web Interface Guidelines and design compliance.
      Trigger for accessibility checks (erişilebilirlik denetle, a11y check), or design
      guidelines checks. Do NOT use for git commands, styling fonts, or running unit
      tests.
    triggers_on:
    - erişilebilirlik denetle
    - a11y check
    - design guidelines check
    inputs:
    - UI code files
    outputs:
    - a11y compliance report
    depends_on:
    - ui-ux-pro-max
    next_steps: []
    run_last: false
    exclusions: []
  audit:
  - name: diff-review
    path: .agent/skills/diff-review/SKILL.md
    description: Git diff çıktılarını analiz ederek yıkıcı ve tehlikeli kod örüntülerini
      (pattern) tespit eder. Sadece kod değişikliklerini (git diff veya commit öncesi)
      incelemek için kullanın. Yeni git branch'i oluşturma, kod commit'leme veya genel
      git işlemleri için KULLANMAYIN.
    triggers_on:
    - diff review
    - commit check
    - git diff check
    inputs:
    - git diff output
    outputs:
    - checks verdict (pass/fail)
    depends_on: []
    next_steps:
    - git-commit
    run_last: false
    exclusions: []
  - name: fallow
    path: .agent/skills/fallow/SKILL.md
    description: Codebase intelligence for JS/TS. Reports quality, dead-code, unused
      dependencies, circular dependencies, duplication, and complexity. Use when running
      fallow, dead-code checks, or unused dependency analysis. Do NOT use for database
      operations, environment installations, or general text/git/font formatting tasks.
    triggers_on:
    - fallow run
    - dead-code check
    - unused dependencies check
    inputs:
    - source files graph
    outputs:
    - fallow health output report
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
  - name: lighthouse-performance-guard
    path: .agent/skills/lighthouse-performance-guard/SKILL.md
    description: Automates web page performance audits, Lighthouse tracing, and web
      vitals checks against performance guidelines to prevent regressions. Do NOT
      use for general database setup, running local unit tests (Vitest), formatting
      markdown tables, or styling fonts.
    triggers_on:
    - lighthouse audit
    - performance check
    - web vitals check
    inputs:
    - local web server page url
    outputs:
    - tracing analysis report
    depends_on: []
    next_steps:
    - performance-alignment
    run_last: false
    exclusions: []
  - name: performance-alignment
    path: .agent/skills/performance-alignment/SKILL.md
    description: Coordinates collaborative, multi-turn RAG analysis with NotebookLM
      to diagnose and create performance alignment plans or performance trace analysis.
      Trigger for performance plans and RAG performance alignment queries. Do NOT
      use for general database reset, git commands, or typography styling.
    triggers_on:
    - performans planı
    - RAG performance alignment
    inputs:
    - performance trace logs
    outputs:
    - performance alignment plan
    depends_on:
    - lighthouse-performance-guard
    next_steps: []
    run_last: false
    exclusions: []
  - name: venthub-auditor
    path: .agent/skills/venthub-auditor/SKILL.md
    description: VentHub'ın mutlak kalite bekçisidir. Mimari bütünlük, pre-commit
      kontrolleri, bütünlük denetimi (bütünlük denetle) ve integrity check gerçekleştirir.
      Birim testlerini çalıştırmak (Vitest), git branch oluşturmak veya veritabanı
      sıfırlamak için KULLANMAYIN.
    triggers_on:
    - integrity check
    - bütünlük denetle
    - pre-commit check
    inputs:
    - working directory state
    outputs:
    - integrity verification status
    depends_on:
    - venthub-architecture
    next_steps:
    - venthub-enterprise-audit
    run_last: false
    exclusions: []
  - name: venthub-catalog-importer
    path: .agent/skills/venthub-catalog-importer/SKILL.md
    description: Ingests and validates HVAC catalog PDFs. Trigger for importing catalogs
      (katalog oku), scanning PDFs (pdf scan), and HVAC catalog imports. Do NOT use
      for running unit tests, creating git branches, or database resets.
    triggers_on:
    - katalog oku
    - pdf scan
    - hvac catalog import
    inputs:
    - catalog pdf files
    outputs:
    - validated catalog data JSON
    depends_on: []
    next_steps: []
    run_last: false
    exclusions: []
  - name: venthub-enterprise-audit
    path: .agent/skills/venthub-enterprise-audit/SKILL.md
    description: 'Proje teslimi öncesi "10/10 Onay" denetim motorudur. L1-L12 adımlarını
      çalıştırıp PASS/FAIL raporu üretir. Tetikleyicileri: enterprise audit, 10/10
      check, sprint delivery check. Genel linter denetimi, veritabanı sıfırlama veya
      git işlemleri için KULLANMAYIN.'
    triggers_on:
    - enterprise audit
    - 10/10 check
    - sprint delivery check
    inputs:
    - final codebase state
    outputs:
    - L1-L12 pass/fail report
    depends_on:
    - venthub-auditor
    - venthub-global-rontgen
    next_steps: []
    run_last: true
    exclusions:
    - venthub-auditor
  - name: venthub-global-rontgen
    path: .agent/skills/venthub-global-rontgen/SKILL.md
    description: 'Proje genelini radar ve rontgen komutlarıyla fiziki olarak tarar.
      Tetikleyicileri: rontgen, radar, global scan, linter check. Veritabanı sıfırlama,
      genel git işlemleri veya sadece birim testleri çalıştırmak amacıyla KULLANMAYIN.'
    triggers_on:
    - rontgen
    - radar
    - global scan
    - linter check
    inputs:
    - project codebase
    outputs:
    - rontgen-template.json log analysis
    depends_on: []
    next_steps:
    - venthub-enterprise-audit
    run_last: false
    exclusions: []
  utils:
  - name: git-commit
    path: .agent/skills/git-commit/SKILL.md
    description: Executes git commit commands, analyzes changes to generate conventional
      commit messages, and handles staging. Trigger for commit requests, conventional
      commits, or the /commit command. Do NOT use for other git operations (like creating
      a new branch) or general text formatting.
    triggers_on:
    - commit yap
    - /commit
    - conventional commit
    inputs:
    - staged changes diff
    outputs:
    - formatted git commit message
    depends_on:
    - diff-review
    - venthub-auditor
    next_steps: []
    run_last: true
    exclusions: []
  - name: to-issues
    path: .agent/skills/to-issues/SKILL.md
    description: Breaks a plan, specification, or PRD into structured issues or tasks.
      Trigger for creating issues (issue oluştur), dividing plans (planı böl), or
      tasks to issues. Do NOT use for general git operations, styling fonts, or running
      unit tests.
    triggers_on:
    - issue oluştur
    - planı böl
    - tasks to issues
    inputs:
    - approved implementation plan
    outputs:
    - structured issues list
    depends_on:
    - to-prd
    next_steps:
    - teamwork-director
    run_last: false
    exclusions: []
  - name: to-prd
    path: .agent/skills/to-prd/SKILL.md
    description: Turns the current conversation transcript or context into a structured
      PRD (Product Requirements Document). Trigger for generating a PRD (prd üret,
      prd oluştur, chat to prd). Do NOT use for git commands, styling fonts, running
      unit tests, or database resets.
    triggers_on:
    - prd üret
    - prd oluştur
    - chat to prd
    inputs:
    - conversation transcript
    outputs:
    - product requirements document
    depends_on: []
    next_steps:
    - to-issues
    run_last: false
    exclusions: []
