# skip_dirs ISIM-TABANLIDIR ve HER DERINLIKTE eslesir (corpus_callosum/cli/docs_tree.py:57
# `d not in _all_skip`) — kok-sabitleme YOK. Bu yuzden buraya yazilan her ad, ayni adi tasiyan
# GERCEK kaynak dizinini de kor eder. Liste "zararsiz temizlik" degil, GENIS bir kesicidir.
#   OLCULDU (2026-08-30, A/B; sizinti dizinleri fiilen yaratilarak, uc kolda tek tek):
#     · `.agents` -> ETKISIZ. Yurutec zaten nokta-dizinleri atliyor (docs_tree.py:56
#       `not d.startswith('.')`); listede olsa da olmasa da agacta 0. Savunma derinligi olarak
#       DURUYOR ama tek basina bir sey COZMUYOR — "kok sebep kapandi" diye OKUMA.
#     · `cache`   -> KALDIRILDI (REC-84'te eklenmisti). Kok `cache/` sizintisini kapatiyordu
#       AMA ayni hamlede `src/lib/cache/tags.ts` agactan SILINIYORDU (olculdu: 1 -> 0; tek
#       degisken, negatif kontrol yapildi). Kok `cache/` gecici, makineye-ozel bir tarama
#       artigi; `src/lib/cache` ise companion'i olan GERCEK modul. Kozmetik bir satir icin
#       gercek bir modulu ikizin gozunden saklamak KOTU takas.
#   ACIK KALAN: kok `cache/` sizintisinin VentHub tarafinda guvenli karsiligi YOK
#   (`source_dirs: [src, .]` koku de tariyor). Gercek cozum uretec tarafinda kok-sabitli
#   girdi destegi (`/cache` gibi) — ORION kalemi, bu depoda kapatilamaz.
#   Ayrinti + olcum tablosu: docs/standards/uretilmis-artefakt-standard.md
skip_dirs: [__pycache__, .git, .agent, .agents, .venv, venv, mcp-env, node_modules, tests, __tests__, .pytest_cache, .ruff_cache, build, dist, egg-info, registry]
# README.md ve uretilen master'lar buradadir: kok README'si AYRI kaynak olarak
# yuklenir (standalone_files), master supurmesine de girerse ikiz ayni belgeyi
