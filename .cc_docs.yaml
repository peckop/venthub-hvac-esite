# KUME MASTER'LARI (T020-OR, 2026-08-26)
#
# NICIN: defterde 96 AYRI kaynak vardi — her cetvel, her denetim, her plan tekil
# yukleniyordu. Iki bedeli vardi: (a) defter sisiyor, tam senkron uzuyordu;
# (b) asagidaki `standalone_files` listesi ELLE bakildigi icin KAPSAM DUSUKTU —
# 2026-08-26 olcumu: diskte 40 denetim + 49 plan varken listede 5 + 7 kalem vardi,
# yani 77 belge ikizde HIC YOKTU.
#
# Kume master'i ikisini birden cozer: dizin OTOMATIK taranir (kapsam tam) ve TEK
# dosya yuklenir (kaynak sayisi duser). Yeni bir cetvel eklendiginde buraya bir
# sey YAZMAK GEREKMEZ.
#
# EMILIM OTOMATIKTIR: bir kume master'ina giren dosya `standalone_files`'ta kalsa
# bile AYRI yuklenmez (docs_tree.emilenleri_suz). Boylece ikiz ayni belgeyi iki
# surumde gormez ve "listeden cikarmayi unutma" diye elle bakim kalmaz.
#
# include_files ADIYLA istenen dosyalardir ve BULUNAMAZSA KOSUM PATLAR — sessizce
# atlanan bir dosya, ikizde VAR SANILAN ama OLMAYAN bir belge dogururdu.
extra_masters:
  - name: "supabase_functions_master.md"
    source_dirs: "supabase/functions"
    output: "docs/supabase_functions_master.md"
  - name: "standards_master.md"
    source_dirs: ["docs/standards", "docs/reference"]
    output: "docs/standards_master.md"
  - name: "kayitlar_master.md"
    source_dirs: ["docs/audits", "docs/plans"]
    # docs/system_tree.md BURADA: defterdeki "System Tree" kaynagi 2026-06-02'de
    # kalmisti ve hicbir sey onu tazelemiyordu (boru hattinda KODA GOMULU olarak
    # master supurmesinden atlaniyor). Kume master'ina alinca her senkronda
    # yeniden uretilen GUNCEL agac ikize girer; "bayat mi, hic mi" ikilemi kalkar.
    include_files: ["CONTEXT.md", "PROJECT.md", "VISION.md", "RECOMMENDATIONS.md", "CHANGELOG.md", "docs/README.md", "docs/DURUM-TAKIP.md", "docs/system_tree.md"]
    output: "docs/kayitlar_master.md"

