<!DOCTYPE html><html lang="tr"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>Köşe</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:hsl(var(--surface-page));font-family:var(--font-sans);color:hsl(var(--text-strong));padding:20px;-webkit-font-smoothing:antialiased}a{color:hsl(var(--primary-navy))}a:hover{color:hsl(var(--text-strong))}.m{font-size:12.5px;font-variant-numeric:tabular-nums;color:hsl(var(--text-body))}.e{font-size:var(--size-overline);font-weight:600;letter-spacing:var(--track-overline);text-transform:uppercase;color:hsl(var(--text-body))}.r{display:flex;gap:12px;flex-wrap:wrap}.g{display:grid;gap:12px}.sw{background:hsl(var(--surface-card));border:1px solid hsl(var(--border-hairline));border-radius:16px;overflow:hidden}.sw>div:first-child{height:56px}.sw>div:last-child{padding:9px 12px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;font-variant-numeric:tabular-nums}.sw span{color:hsl(var(--text-muted))}</style></head><body>
<div class="g" style="grid-template-columns:repeat(5,1fr)">
<div class="g" style="gap:8px"><div style="height:64px;background:#fff;border:1px solid hsl(var(--border-hairline));border-radius:var(--radius-dugme)"></div><div class="m"><b>dugme</b> 999</div></div>
<div class="g" style="gap:8px"><div style="height:64px;background:#fff;border:1px solid hsl(var(--border-hairline));border-radius:var(--radius-kart)"></div><div class="m"><b>kart</b> 16</div></div>
<div class="g" style="gap:8px"><div style="height:64px;background:#fff;border:1px solid hsl(var(--border-hairline));border-radius:var(--radius-kart-buyuk)"></div><div class="m"><b>kart-buyuk</b> 24</div></div>
<div class="g" style="gap:8px"><div style="height:64px;background:#fff;border:1px solid hsl(var(--border-hairline));border-radius:var(--radius-kucuk)"></div><div class="m"><b>kucuk</b> 12</div></div>
<div class="g" style="gap:8px"><div style="height:64px;background:#fff;border:1px solid hsl(var(--border-hairline));border-bottom:0;border-radius:var(--radius-panel)"></div><div class="m"><b>panel</b> 8 üst</div></div></div>
</body></html>
