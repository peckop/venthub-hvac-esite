<!-- @dsCard group="Hareket" viewport="700x210" name="Hareket sınıfları" subtitle="Arayüz tepkisi 120–280 ms · geçiş 500–800 ms · üstüne gelin" -->
<!DOCTYPE html><html lang="tr"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>Hareket sınıfları</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:hsl(var(--surface-page));font-family:var(--font-sans);color:hsl(var(--text-strong));padding:20px;-webkit-font-smoothing:antialiased}a{color:hsl(var(--primary-navy))}a:hover{color:hsl(var(--text-strong))}.m{font-size:12.5px;font-variant-numeric:tabular-nums;color:hsl(var(--text-body))}.e{font-size:var(--size-overline);font-weight:600;letter-spacing:var(--track-overline);text-transform:uppercase;color:hsl(var(--text-body))}.r{display:flex;gap:12px;flex-wrap:wrap}.g{display:grid;gap:12px}.sw{background:hsl(var(--surface-card));border:1px solid hsl(var(--border-hairline));border-radius:16px;overflow:hidden}.sw>div:first-child{height:56px}.sw>div:last-child{padding:9px 12px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;font-variant-numeric:tabular-nums}.sw span{color:hsl(var(--text-muted))}.t{display:flex;flex-direction:column;gap:8px}.k{height:56px;background:#fff;border:1px solid hsl(var(--border-hairline));border-radius:16px;position:relative;cursor:pointer}.n{position:absolute;left:8px;top:14px;width:26px;height:26px;border-radius:999px;background:hsl(var(--primary-navy));transition:left var(--d) var(--c)}.k:hover .n{left:calc(100% - 34px)}</style></head><body>
<div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="t" style="--d:var(--hareket-hizli);--c:var(--hareket-egri)"><div class="k"><div class="n"></div></div><div class="m"><b>hizli</b> 120 ms</div></div>
<div class="t" style="--d:var(--hareket-normal);--c:var(--hareket-egri)"><div class="k"><div class="n"></div></div><div class="m"><b>normal</b> 200 ms</div></div>
<div class="t" style="--d:var(--hareket-acilis);--c:var(--hareket-egri)"><div class="k"><div class="n"></div></div><div class="m"><b>acilis</b> 280 ms</div></div>
<div class="t" style="--d:var(--hareket-gecis);--c:var(--hareket-gecis-egri)"><div class="k"><div class="n"></div></div><div class="m"><b>gecis</b> 600 ms</div></div></div>
<div class="m" style="margin-top:14px">Eğri: arayüz cubic-bezier(0.2, 0, 0, 1) · geçiş cubic-bezier(0.2, 0.9, 0.25, 1). Hareketi azalt → 0.</div>
</body></html>
