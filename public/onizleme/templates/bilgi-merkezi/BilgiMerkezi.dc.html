<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Bilgi Merkezi" description="İş emri #20-5: S5 'Bilgi Merkezi' birebir: başlık + yazılarda arama, Kısa yollar, Mühendislik (3 rehber özeti; yalnız TR), Ürün belgeleri (5 tür). Rehber verisi assets/ornek/rehber.json; konum SectionRail'de." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;-webkit-font-smoothing:antialiased}[data-vh-bilgi][data-mob="1"]{padding:0 18px 30px !important}[data-vh-bilgi][data-mob="1"] h1{font-size:28px !important}[data-vh-bilgi][data-mob="1"] [data-bm-ara]{min-width:0 !important;flex:1 1 100% !important}[data-vh-bilgi][data-mob="1"] [data-bm-tur]{width:96px !important}</style></helmet>
<div data-vh-bilgi="" data-mob="{{ mobA }}" lang="{{ lang }}" style="display:flex;flex-direction:column;gap:22px;padding:0 40px 44px;background:hsl(var(--surface-page));font-family:var(--font-sans);color:hsl(var(--text-strong))">
<div style="width:100%;max-width:1060px;min-width:0;margin:0 auto"><x-import component-from-global-scope="DesignSystem_4f7164.SectionRail" dc-props="{{ rail }}" hint-size="100%,61px"></x-import></div>
<div style="width:100%;max-width:1060px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-wrap:wrap;gap:14px 40px;align-items:center;justify-content:space-between;min-height:64px">
<div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-family:var(--font-baslik);font-size:40px;font-weight:700;letter-spacing:-0.025em;line-height:1.15">{{ b.h1 }}</h1><span style="font-size:var(--size-body-small);color:hsl(var(--text-body))">{{ b.alt }}</span></div>
<label data-bm-ara="" style="flex:0 1 480px;min-width:260px;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;box-sizing:border-box;background:hsl(var(--surface-card));border:1px solid hsl(var(--border-hairline))"><img src="../../assets/icons/ui/venthub-ui-arama-22.svg" alt="" width="20" height="20" style="width:20px;height:20px"><input type="search" value="{{ b.q }}" onChange="{{ b.setQ }}" placeholder="{{ b.ph }}" aria-label="{{ b.ph }}" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:var(--size-body);color:hsl(var(--text-strong))"></label>
</div>
<sc-if value="{{ b.qVar }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;background:hsl(var(--surface-card));border:1px solid hsl(var(--border-hairline))"><sc-for list="{{ b.sonuc }}" as="r" hint-placeholder-count="3"><button type="button" onClick="{{ r.ac }}" style="display:flex;gap:12px;align-items:baseline;min-height:48px;padding:12px 16px;border:0;border-bottom:1px solid hsl(var(--border-row));background:transparent;text-align:left;font:inherit;cursor:pointer" style-hover="background:hsl(var(--surface-subtle))"><span data-bm-tur="" style="font-size:var(--size-caption);font-weight:600;letter-spacing:0.08em;color:hsl(var(--brand-cyan-ink));flex:none;width:120px">{{ r.tur }}</span><span style="font-size:var(--size-body);color:hsl(var(--text-strong))">{{ r.ad }}</span></button></sc-for><sc-if value="{{ b.yok }}" hint-placeholder-val="{{ false }}"><span style="padding:14px 16px;font-size:var(--size-body-small);color:hsl(var(--text-body))">{{ b.yokM }}</span></sc-if></div></sc-if>
</div>
<section data-screen-label="Bilgi Merkezi" style="width:100%;max-width:1060px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">{{ b.kisaB }}</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><sc-for list="{{ b.niyet }}" as="n" hint-placeholder-count="1"><button type="button" onClick="{{ n.ac }}" style="display:flex;flex-direction:column;gap:8px;padding:18px;background:hsl(var(--surface-card));border:1px solid hsl(var(--border-hairline));border-top:2px solid hsl(var(--primary-navy));text-align:left;font:inherit;cursor:pointer" style-hover="border-color:hsl(var(--primary-navy))"><span style="font-size:var(--size-editorial);font-weight:600;line-height:1.3;color:hsl(var(--text-strong))">{{ n.soru }}</span><span style="font-size:var(--size-body-small);line-height:1.5;color:hsl(var(--text-body))">{{ n.ne }}</span><span style="font-size:var(--size-body-small);font-weight:600;color:hsl(var(--text-strong));margin-top:auto">{{ n.hedef }} →</span></button></sc-for></div></div>
<sc-if value="{{ b.rehberVar }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">{{ b.muhB }}</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px"><sc-for list="{{ b.muh }}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{ k.ac }}" style="display:flex;flex-direction:column;gap:8px;padding:16px;background:hsl(var(--surface-card));border:1px solid hsl(var(--border-hairline));text-align:left;font:inherit;cursor:pointer" style-hover="border-color:hsl(var(--primary-navy))"><span style="font-size:var(--size-editorial);line-height:1.5;color:hsl(var(--text-strong));font-variant-numeric:tabular-nums">“{{ k.cevap }}”</span><span style="font-size:var(--size-editorial);font-weight:600;line-height:1.3;color:hsl(var(--text-strong))">{{ k.ad }} →</span><span style="font-size:var(--size-caption);color:hsl(var(--text-body))">{{ k.alt }}</span></button></sc-for></div><div><x-import component-from-global-scope="DesignSystem_4f7164.CerceveliDugme" onClick="{{ b.muhGit }}" hint-size="auto,44px">{{ b.muhTum }}</x-import></div></div></sc-if>
<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><h2 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">{{ b.belgeB }}</h2><span style="font-size:var(--size-body-small);color:hsl(var(--text-body))">{{ b.belgeNot }}</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px"><sc-for list="{{ b.belge }}" as="k" hint-placeholder-count="5"><button type="button" onClick="{{ k.ac }}" style="display:flex;flex-direction:column;gap:8px;min-height:96px;padding:16px;background:hsl(var(--surface-card));border:1px solid hsl(var(--border-hairline));text-align:left;font:inherit;cursor:pointer" style-hover="border-color:hsl(var(--primary-navy))"><img src="../../assets/icons/ui/venthub-ui-indir-pdf-22.svg" alt="" width="22" height="22" style="width:22px;height:22px"><span style="font-size:var(--size-body);font-weight:600;color:hsl(var(--text-strong))">{{ k.ad }} →</span></button></sc-for></div></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1240px&quot;,&quot;height&quot;:&quot;1000px&quot;},&quot;mobil&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dil&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;TR&quot;,&quot;EN&quot;],&quot;default&quot;:&quot;TR&quot;,&quot;tsType&quot;:&quot;'TR' | 'EN'&quot;},&quot;metin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, string | null&gt;&quot;},&quot;onGit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(tip: string, ek?: string | object) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { metin: null, dil: null, rehber: null, q: '' };
  yukle() {
    const dil = (this.props.dil || 'TR').toUpperCase() === 'EN' ? 'en' : 'tr';
    if (this.state.dil === dil) return;
    this.setState({ dil });
    const al = (u) => fetch(u).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    Promise.all([al('../../assets/ornek/sozluk-s5.' + dil + '.json'), al('../../assets/ornek/sozluk-ek.' + dil + '.json'), null, this.state.rehber ? null : al('../../assets/ornek/rehber.json')]).then(([a, b, c, r]) => { const m = { ...(a || {}), ...(b || {}) }; if (c) for (const k in c) if (k[0] !== '_' && m[k] == null) m[k] = c[k]; this.setState(r ? { metin: m, rehber: r.rehber } : { metin: m }); });
  }
  componentDidMount() { this.yukle(); }
  componentDidUpdate() { this.yukle(); }
  renderVals() {
    const P = this.props, s = this.state, mob = !!P.mobil, DIL = (P.dil || 'TR').toUpperCase(), en = DIL === 'EN', M = P.metin || s.metin || {}, git = P.onGit || (() => {});
    const A = (k) => (M[k] == null ? '\u27E6' + k + '\u27E7' : M[k]);
    /* S5: rehberler yalnız TR (rehberGoster: dil !== EN). */
    const R = en ? [] : (s.rehber || []);
    const mAc = (id) => () => git('makale', id);
    const BT = [['js.Katalog', 'js.Kataloglar', 'Katalog'], ['js.Teknik föy', 'js.Teknik föyler', 'Teknik föy'], [null, 'js.CAD çizimleri', 'CAD'], ['js.Kılavuz', 'js.Kurulum kılavuzları', 'Kılavuz'], ['js.Uygunluk', 'js.Uygunluk beyanları', 'Uygunluk']];
    const q = String(s.q || '').trim().toLocaleLowerCase(en ? 'en-GB' : 'tr-TR');
    const havuz = R.map((r) => ({ tur: r.tur, ad: r.ad, ac: mAc(r.id) })).concat(BT.map(([k, , t]) => ({ tur: A('js.Ürün belgesi'), ad: k ? A(k) : t, ac: () => git('belge', { tur: t }) })));
    const sonuc = q ? havuz.filter((x) => (x.ad + ' ' + x.tur).toLocaleLowerCase(en ? 'en-GB' : 'tr-TR').includes(q)).slice(0, 8) : [];
    const muh = ['radyal-aksiyel', 'kanal-kaybi', 'ses'].map((id) => R.find((r) => r.id === id)).filter(Boolean).map((r) => ({ cevap: r.cevap, ad: r.ad, alt: r.tur + ' \u00B7 ' + A('tx.e_ilgili') + ' ' + r.ilgili, ac: mAc(r.id) }));
    return {
      lang: DIL.toLowerCase(), mobA: mob ? '1' : '0',
      b: {
        h1: A('js.Bilgi Merkezi'), alt: A('tx.e_destekKisa'), ph: A('tx.e_destekAraPhN'), q: s.q, setQ: (e) => this.setState({ q: e.target.value }), qVar: !!q, sonuc, yok: !!q && !sonuc.length, yokM: A('tx.e_esleYok'),
        kisaB: A('tx.e_kisaYol'), niyet: [{ soru: A('t.hesaplayicilar'), ne: A('t.debi-hava-degisimi-ve-kanal-kaybi-hesaplari'), hedef: A('t.hesaplayicilar'), ac: () => git('hesaplayici') }],
        rehberVar: muh.length > 0, muhB: A('tx.e_muh'), muh, muhTum: A('tx.e_tumMuh').replace(/\s*→\s*$/, '') + ' →', muhGit: () => git('muhendislik'),
        belgeB: A('tx.e_urunBelge'), belgeNot: A('tx.e_belgeNot'), belge: BT.map(([, ad, t]) => ({ ad: A(ad), ac: () => git('belge', { tur: t }) }))
      },
      rail: { metin: M, mobil: mob, yapiskan: false, bolumler: [], konum: [{ ad: A('tx.e_anasayfa'), href: '#', onClick: (e) => { e.preventDefault(); git('anasayfa'); } }, { ad: A('js.Bilgi Merkezi') }] }
    };
  }
}
</script>
</body>
</html>
