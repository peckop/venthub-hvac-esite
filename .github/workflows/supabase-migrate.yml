name: Supabase Migrate

on:
  push:
    branches: [ master ]
    paths:
      - 'supabase/migrations/**.sql'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

# cancel-in-progress KAPALI: bir migration koşusu iptal edilirse o push'un migration'ı
# hiç uygulanmadan kaybolabilir. Koşular sıraya girer, iptal edilmez.
concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test DB connection
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 1;"

      # Ledger modeli: her migration dosyası DB'ye BİR KEZ uygulanır ve
      # public._migration_ledger'a kaydedilir. Kayıtlı dosya atlanır.
      # Yeni dosyada hata = koşu KIRMIZI (eski "hata yutma" davranışı bilinçli kaldırıldı;
      # 2026-08-11'de F1/F2 sessiz rollback'leri bu yüzden ancak elle DB doğrulamayla yakalanmıştı).
      - name: Ensure migration ledger
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists public._migration_ledger (
            name text primary key,
            applied_at timestamptz not null default now()
          );
          alter table public._migration_ledger enable row level security;
          SQL

      # İlk koşu baseline'ı: ledger boşsa, repodaki TÜM mevcut dosyalar zaten prod'a
      # uygulanmış kabul edilir (bu workflow'un devraldığı tarihsel durum) ve yalnız
      # kaydedilir, YENİDEN UYGULANMAZ. Sonraki koşularda ledger tek otorite.
      - name: Baseline ledger (first run only)
        run: |
          set -euo pipefail
          COUNT=$(psql "$DB_URL" -tAc "select count(*) from public._migration_ledger;")
          if [ "$COUNT" != "0" ]; then
            echo "Ledger dolu ($COUNT kayıt) — baseline atlandı."
            exit 0
          fi
          echo "Ledger boş — mevcut ${GITHUB_SHA:0:8} anındaki tüm dosyalar baseline'lanıyor."
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
              "insert into public._migration_ledger(name) values ('$base') on conflict do nothing;"
          done

      - name: Apply new migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          applied=0
          skipped=0
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            seen=$(psql "$DB_URL" -tAc "select 1 from public._migration_ledger where name = '$base' limit 1;")
            if [ "$seen" = "1" ]; then
              skipped=$((skipped + 1))
              continue
            fi
            # ATOMİKLİK. İki meşru biçim var, üçüncüsü yok:
            #   (a) dosya kendi BEGIN;/COMMIT;'ini yazar  -> OLDUĞU GİBİ koşulur.
            #       Bunu körü körüne sarmak YANLIŞ olurdu: bazı dosyalar bilinçli olarak
            #       COMMIT'ten SONRA işlem-dışı ifadeler taşır (ör.
            #       20260402000000_security_and_performance_hardening.sql: BEGIN@7,
            #       COMMIT@95, ardından CREATE INDEX CONCURRENTLY@103-112 — CONCURRENTLY
            #       bir transaction bloğunun İÇİNDE çalışamaz).
            #   (b) dosya işlem denetimi içermez -> psql --single-transaction ile SARILIR.
            # Sarılmamış çok-ifadeli bir dosya ortasında patlarsa DB YARI-UYGULANMIŞ kalır,
            # ledger'a yazılmaz ve bir sonraki koşu baştan dener = ikinci kez yarım uygulama.
            # PR anında aynı kural INV-MIGRATION-1 ile de denetlenir (bkz. conformance).
            if grep -qiE '^[[:space:]]*(begin|start[[:space:]]+transaction)[[:space:]]*;' "$f"; then
              TX_ARGS=""
              TX_MODE="dosya kendi işlemini yönetiyor"
            else
              TX_ARGS="--single-transaction"
              TX_MODE="--single-transaction ile sarıldı"
            fi
            echo "▶ Uygulanıyor: $base  [$TX_MODE]"
            # shellcheck disable=SC2086
            if psql "$DB_URL" -v ON_ERROR_STOP=1 $TX_ARGS -f "$f"; then
              psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
                "insert into public._migration_ledger(name) values ('$base');"
              echo "✅ $base uygulandı ve ledger'a kaydedildi"
              applied=$((applied + 1))
            else
              echo "::error file=$f::Migration BAŞARISIZ: $base — koşu kırmızı. Atomiklik: $TX_MODE, yani bu dosya ya kendi işleminde ya da --single-transaction içinde koştu; kısmi yazım BEKLENMEZ. Yine de DB'yi doğrula."
              exit 1
            fi
          done
          echo "### Supabase Migrate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Uygulanan: $applied · Atlanan (ledger'da): $skipped" >> "$GITHUB_STEP_SUMMARY"
