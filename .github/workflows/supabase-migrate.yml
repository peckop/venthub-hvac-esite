name: Supabase Migrate

on:
  push:
    branches: [ master ]
    paths:
      - 'supabase/migrations/**.sql'
      - 'scripts/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test DB connection
        run: |
          psql "$DB_URL" -c "select 1;"

      - name: Apply migrations via psql
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
             echo "No migrations found."
             exit 0
          fi
          
          failed=0
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            if psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1; then
              echo "✅ $f applied successfully"
            else
              echo "⚠️ $f had errors (may already be applied)"
              failed=$((failed + 1))
            fi
          done
          
          echo "✅ Migration process completed. Files with errors: $failed"


