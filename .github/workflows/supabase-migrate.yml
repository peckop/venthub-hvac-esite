name: Supabase Migrate

on:
  push:
    branches: [ master ]
    paths:
      - 'supabase/migrations/**.sql'
      - 'scripts/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Database Connection
        # Bracket notation (secrets['...']) ile IDE uyarilarini 0'a indirmeyi hedefliyoruz.
        # Bu yontem en stabil ve CI tarafini 'Yeşil' tutan yontemdir.
        env:
          DB_PASS: ${{ secrets['SUPABASE_DB_PASSWORD'] }}
          PROJ_REF: ${{ secrets['SUPABASE_PROJECT_REF'] }}
          RAW_URL: ${{ secrets['SUPABASE_DB_URL'] }}
        run: |
          # Proje Referansı (Fallback: tnofewwkwlyjsqgwjjga)
          P_REF="${PROJ_REF:-tnofewwkwlyjsqgwjjga}"
          
          if [ -n "$DB_PASS" ]; then
            echo "🚀 Rebuilding Pooler Connection String..."
            # Havuzlayici (Pooler) icin kullanici adini otomatik olarak postgres.REF formatına getiriyoruz.
            echo "DB_URL=postgresql://postgres.${P_REF}:${DB_PASS}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require" >> $GITHUB_ENV
          else
            echo "⚠️ Falling back to raw SUPABASE_DB_URL..."
            echo "DB_URL=$RAW_URL" >> $GITHUB_ENV
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test DB connection
        run: |
          psql "$DB_URL" -c "select 1;"

      - name: Apply migrations via psql
        run: |
          set -e
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
             echo "No migrations found."
             exit 0
          fi
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "✅ All migrations completed successfully."

