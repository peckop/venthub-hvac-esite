name: Supabase Migrate

on:
  push:
    branches: [ master ]
    paths:
      - 'supabase/migrations/**.sql'
      - 'scripts/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secret'lar artik burada (Job-level env) degil, adimlarin icinde tanimlanacak (IDE uyarilarini onlemek icin)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide execution path (prefer psql for stability)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "${SUPABASE_DB_URL}" ]; then
            echo "Will use psql with SUPABASE_DB_URL."
            exit 0
          fi
          if [ -n "${SUPABASE_ACCESS_TOKEN}" ] && [ -n "${SUPABASE_PROJECT_REF}" ]; then
            echo "DB_URL missing — fallback to Supabase CLI."
            exit 0
          fi
          echo "::error::Missing configuration. Set SUPABASE_DB_URL or fallback variables."
          exit 1

      - name: Install PostgreSQL client
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Show target and list migrations
        run: |
          echo "Migrations in repo:" && ls -1 supabase/migrations || true
          # Host mask (do not print full URL)
          echo "Target host: $(echo "$SUPABASE_DB_URL" | sed -E 's|.*@([^:/]+).*|\1|')"

      - name: Normalize DB URL (Rebuild for Pooler Stability)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # DİKKAT: Maskelenmis veriler (***) üzerinde sed/grep calismaz.
          # Bu yüzden URL'yi sıfırdan inşa ediyoruz.
          
          RAW_URL="${SUPABASE_DB_URL}"
          P_REF="${SUPABASE_PROJECT_REF:-tnofewwkwlyjsqgwjjga}"
          P_PASS="${SUPABASE_DB_PASSWORD}"
          
          # Eğer tam URL verilmişse ve Pooler formatı DEĞİLSE (nokta yoksa) otomatik düzeltmeye çalışalım
          # Ama parolanın da elimizde olması lazım (Secrets'ta tanımlanmış olması şart)
          if [[ -n "$P_PASS" ]] && [[ -n "$P_REF" ]]; then
            echo "🚀 Rebuilding Pooler URL with component-based protocol..."
            NEW_URL="postgresql://postgres.${P_REF}:${P_PASS}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require"
            echo "DB_URL=$NEW_URL" >> $GITHUB_ENV
          else
            echo "⚠️ Fallback: Using raw SUPABASE_DB_URL (Sed manipulations will fail if masked)."
            # Minimal normalizasyon
            if [[ "$RAW_URL" != *"sslmode="* ]]; then
              if [[ "$RAW_URL" == *"?"* ]]; then RAW_URL="${RAW_URL}&sslmode=require"; else RAW_URL="${RAW_URL}?sslmode=require"; fi
            fi
            echo "DB_URL=$RAW_URL" >> $GITHUB_ENV
          fi
          
          echo "✅ Normalization complete."

      - name: Test DB connection
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          psql "$DB_URL" -c "select 1;"

      - name: Apply migrations via psql
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          set -e
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations to apply."
            exit 0
          fi
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" || echo "Warning: $f may have already been applied"
          done
          echo "Migrations applied successfully via psql."

