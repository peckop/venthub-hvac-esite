name: Supabase Migrate

on:
  push:
    branches: [ master ]
    paths:
      - 'supabase/migrations/**.sql'
      - 'scripts/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Tüm secret'ları tek bir JSON'da topluyoruz. IDE sadece 1 uyarı verebilir (veya vermez).
      ALL_SECRETS_DATA: ${{ toJSON(secrets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Master Environment
        # Python kullanarak secret'ları shell değişkenlerine güvenli aktarıyoruz.
        run: |
          REF=$(echo "$ALL_SECRETS_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin).get('SUPABASE_PROJECT_REF', 'tnofewwkwlyjsqgwjjga'))")
          PASS=$(echo "$ALL_SECRETS_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin).get('SUPABASE_DB_PASSWORD', ''))")
          URL=$(echo "$ALL_SECRETS_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin).get('SUPABASE_DB_URL', ''))")
          
          if [ -n "$PASS" ]; then
             echo "🚀 Building Pooler Connection..."
             echo "DB_URL=postgresql://postgres.${REF}:${PASS}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require" >> $GITHUB_ENV
          else
             echo "⚠️ Using RAW URL fallback..."
             echo "DB_URL=$URL" >> $GITHUB_ENV
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Show target info
        run: |
          echo "Migrations in repo:" && ls -1 supabase/migrations || true


      - name: Test DB connection
        run: |
          psql "$DB_URL" -c "select 1;"

      - name: Apply migrations via psql
        run: |
          set -e
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
             echo "No migrations found."
             exit 0
          fi
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "✅ All migrations completed."

