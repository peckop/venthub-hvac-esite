name: '🤖 AI Auto-Repair'

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  repair:
    # Sadece CI başarısız (failure) olduğunda çalış
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      pull-requests: 'write'
      actions: 'read'
    
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: 'Download CI Logs'
        uses: 'actions/download-artifact@v4'
        with:
          name: 'ci-logs'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: 'Check for Logs'
        run: |
          if [ -f "build-error.log" ]; then
            echo "✅ Hata logu bulundu."
            cat build-error.log | head -n 50
          else
            echo "❌ Hata logu bulunamadı! CI loglarını doğrudan okumaya çalışacağım."
          fi

      - name: 'Invoke Gemini Repair Agent'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: |
            CI/Build sürecimiz az önce BAŞARISIZ oldu. 
            Görevin: Hatayı analiz et ve `src/components/SearchOverlay.tsx` dosyasındaki Build engelini kaldır.
            
            HATA KAYNAĞI: `NON_EXISTENT_AI_VARIABLE_ERROR` değişkeni tanımlı olmadığı için build patlıyor.
            ÇÖZÜM: Bu değişkeni içeren satırı sil veya yorum satırı yap.
            
            Düzeltmeyi yaptıktan sonra commit at ve gönder.
