name: '🤖 AI Auto-Repair'

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      pull-requests: 'write'
    
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: 'Invoke Gemini Repair Agent'
        uses: 'google-github-actions/run-gemini-cli@v0'
        # Loglar hem ENV hem de INPUT istiyor, ikisini de veriyoruz.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            CI build fail oldu! 
            Dosya: `src/components/SearchOverlay.tsx`
            Hata: `NON_EXISTENT_AI_VARIABLE_ERROR` tanımlı değil.
            
            GÖREV:
            1. `src/components/SearchOverlay.tsx` içindeki o bozuk satırı (412. satır civarı) bul ve sil.
            2. Değişikliği "🤖 AI: Auto-repair successful" mesajıyla commit et ve pushla.
