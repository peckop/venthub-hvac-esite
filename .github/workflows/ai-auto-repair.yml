name: '🤖 AI Auto-Repair'

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      pull-requests: 'write'
      actions: 'read'
    
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: 'Invoke Gemini Repair Agent'
        uses: 'google-github-actions/run-gemini-cli@v0'
        id: 'gemini_repair'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          prompt: |
            CI sürecimiz başarısız oldu. 
            Hata: `src/components/SearchOverlay.tsx` dosyasında `NON_EXISTENT_AI_VARIABLE_ERROR` değişkeni yüzünden build alınamıyor.
            
            GÖREVİN:
            1. `src/components/SearchOverlay.tsx` dosyasını aç.
            2. Build'i bozan o satırı (NON_EXISTENT_AI_VARIABLE_ERROR içeren satır) bul ve SİL.
            3. Değişikliği commit et ve '🤖 AI: Auto-repair successful' mesajıyla gönder.
