name: '🤖 AI Auto-Repair'

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  repair:
    # Sadece CI başarısız (failure) olduğunda çalış
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      pull-requests: 'write'
      actions: 'read'
    
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: 'Download CI Logs'
        uses: 'actions/download-artifact@v4'
        with:
          name: 'ci-logs'
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: 'Invoke Gemini Repair Agent'
        continue-on-error: true
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: |
            CI/Build sürecimiz az önce BAŞARISIZ oldu. 
            Görevin: Hata loglarını analiz et, hatayı veren dosyayı bul ve kodu build edilebilir hale getir.
            
            1. `pnpm run build` veya `pnpm run lint` komutlarının çıktılarını oku.
            2. Hatayı (Type error, Lint error, Import error) tespit et.
            3. Dosyayı düzelt ve "🤖 AI: Auto-repaired CI failure" mesajıyla commit at.
            
            ⚠️ Sadece hatayı düzelt, mimariyi değiştirme!
