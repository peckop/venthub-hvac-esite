name: DB Advisor

# ⚠️ `push` KASITEN yalnız master (T095/EDGE · 2026-08-19).
# Eskiden dalsız `push:` yazıyordu ve `pull_request` ile BİRLİKTE ateşliyordu: bir dala
# push atıldığında AYNI commit için İKİ advisor koşumu doğuyordu. Aşağıdaki apt asılması
# ile birleşince bu, eşzamanlılık yuvalarını iki katı hızda tüketiyordu — 2026-08-19'da
# bir günde 34 asılı koşum iptal edildi ve filo üç kez kilitlendi.
# Kapsam kaybı YOK: dal push'unda `pull_request` koşar, master'da `push` koşar.
# (Aynı gerekçe `ci.yml` ve `e2e-smoke.yml` içinde de yazılı — ev geleneği bu.)
on:
  push:
    branches: [master]
  pull_request:

jobs:
  advisor:
    runs-on: ubuntu-latest
    # İŞ DÜZEYİ ZAMAN SINIRI — yoktu ve bedeli ağırdı. GitHub varsayılanı ALTI SAAT:
    # apt asılınca her koşum o kadar süre bir eşzamanlılık yuvası tutuyordu. 2026-08-19'da
    # aynı anda 19 asılı koşum ölçüldü ve TÜM filonun kapıları kuyruğa girdi.
    # Sınırsız bir adım yalnız kendi işinin riski değildir; paylaşılan havuzu da yakar.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ══════════════════════════════════════════════════════════════════════
      # apt ADIMI KALDIRILDI (2026-08-19 · ölçüldü, tahmin edilmedi)
      #
      # Eski hâli `sudo apt-get update && sudo apt-get install -y postgresql-client`
      # idi ve bugün filoyu üç kez kilitledi. Sonra BAŞARILI bir koşumun günlüğü açıldı:
      #
      #   The following NEW packages will be installed:  postgresql-client
      #   Need to get 11.6 kB of archives.
      #
      # ONBİR KİLOBAYT. Kurulan tek şey `postgresql-client` META paketi — içinde ikili
      # dosya YOK, yalnız işaretçi. Gerçek istemci (`postgresql-client-16`) koşucu
      # imajında ZATEN VAR; olmasaydı NEW packages listesinde o da görünürdü.
      #
      # Yani 24 dakikalık asılmalar, hiçbir şey kurmayan bir tur için ödeniyordu.
      #
      # NİÇİN `continue-on-error` YETMİYORDU: adım işi kırmızı yapmıyordu ama ASILMASI
      # engellenmiyordu — koşum yine 6 saate kadar yuva tutuyordu. "Hata sayılmıyor"
      # ile "kaynak yakmıyor" AYNI ŞEY DEĞİLDİR.
      #
      # FAIL-CLOSED: imaj bir gün psql'i düşürürse bu adım SESSİZ kalmaz, adıyla düşer.
      # SSOT: docs/standards/ci-runner-install-standard.md §2.6
      # ══════════════════════════════════════════════════════════════════════
      - name: psql var mi (kurulum YOK)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::psql kosucu imajinda YOK — kurulum adimi geri gerekiyor."
            echo "::error::bkz. docs/standards/ci-runner-install-standard.md bolum 2.6"
            exit 1
          fi
          psql --version

      - name: Supabase Advisor (SQL checks)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice title=Supabase Advisor::Secret SUPABASE_DB_URL not set. Skipping SQL checks."
            exit 0
          fi
          export PGSSLMODE=require

          echo "::group::[Advisor] Unindexed foreign keys"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "\
          WITH fks AS (\
            SELECT n.nspname AS schema_name, c.relname AS table_name, con.conname AS fk_name, con.conkey, con.conrelid\
            FROM pg_constraint con\
            JOIN pg_class c ON c.oid = con.conrelid\
            JOIN pg_namespace n ON n.oid = c.relnamespace\
            WHERE con.contype = 'f'\
          )\
          SELECT schema_name, table_name, fk_name\
          FROM fks f\
          WHERE NOT EXISTS (\
            SELECT 1 FROM pg_index i\
            WHERE i.indrelid = f.conrelid\
              AND (i.indkey::int[] @> f.conkey OR i.indkey::int[] = f.conkey)\
          )\
          ORDER BY 1,2;" || true
          echo "::endgroup::"

          echo "::group::[Advisor] Duplicate indexes"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "\
          WITH idx AS (\
            SELECT n.nspname AS schema_name, c.relname AS table_name, i.relname AS index_name,\
                   regexp_replace(pg_get_indexdef(i.oid), '\\s+', ' ', 'g') AS indexdef_norm\
            FROM pg_class c\
            JOIN pg_index ix ON ix.indrelid = c.oid\
            JOIN pg_class i ON i.oid = ix.indexrelid\
            JOIN pg_namespace n ON n.oid = c.relnamespace\
            WHERE n.nspname NOT IN ('pg_catalog','information_schema')\
          )\
          SELECT schema_name, table_name, string_agg(index_name, ', ') AS duplicates, indexdef_norm\
          FROM idx\
          GROUP BY schema_name, table_name, indexdef_norm\
          HAVING COUNT(*) > 1\
          ORDER BY 1,2;" || true
          echo "::endgroup::"

          echo "::group::[Debug] Identity & Environment"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "SELECT current_database() AS db, current_user AS user_name, version() AS pg_version;" || true
          echo "::endgroup::"

          echo "::group::[Debug] cart_items indexes (full)"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "SELECT indexname, indexdef FROM pg_indexes WHERE schemaname='public' AND tablename='cart_items' ORDER BY 1;" || true
          echo "::endgroup::"

          echo "::group::[Debug] cart_items constraints (full)"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "SELECT conname, contype, pg_get_constraintdef(oid) AS def, conindid::regclass AS backing_index FROM pg_constraint WHERE conrelid='public.cart_items'::regclass ORDER BY 1;" || true
          echo "::endgroup::"

          echo "::group::[Debug] cart_items duplicate check (normalized)"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "\
          WITH idx AS (\
            SELECT i.relname AS index_name, regexp_replace(pg_get_indexdef(i.oid), '\\s+', ' ', 'g') AS indexdef_norm\
            FROM pg_class c\
            JOIN pg_index ix ON ix.indrelid = c.oid\
            JOIN pg_class i ON i.oid = ix.indexrelid\
            JOIN pg_namespace n ON n.oid = c.relnamespace\
            WHERE n.nspname='public' AND c.relname='cart_items'\
          )\
          SELECT indexdef_norm, array_agg(index_name) AS indexes\
          FROM idx\
          GROUP BY indexdef_norm\
          HAVING COUNT(*) > 1;" || true
          echo "::endgroup::"

          echo "::group::[Advisor] Unused indexes (idx_scan=0)"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "\
          SELECT schemaname, relname AS table_name, indexrelname AS index_name, idx_scan\
          FROM pg_stat_user_indexes\
          WHERE idx_scan = 0\
          ORDER BY 1,2;" || true
          echo "::endgroup::"

          echo "::group::[Advisor] Multiple permissive RLS policies"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "\
          SELECT schemaname, tablename, cmd, COUNT(*) AS policy_count, string_agg(policyname, ', ') AS policies\
          FROM pg_policies\
          WHERE permissive = 'PERMISSIVE'\
          GROUP BY schemaname, tablename, cmd\
          HAVING COUNT(*) > 1\
          ORDER BY 1,2,3;" || true
          echo "::endgroup::"
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # ON-YOKLAMA IKI KAPIYA HIZMET EDER (2026-08-20, T161-VH - EDGE):
  # `db-gate-precheck` yalnizca "SUPABASE_DB_URL var mi" diye sorar; INV-CATALOG-1 ve
  # INV-RLS-COVERAGE-1 ayni cevaba baglidir. Is adi bilerek DEGISTIRILDI: eski ad
  # `catalog-integrity-precheck` idi ve ikinci kapiyi tasidiginda ad artik yaptigi isi
  # ANLATMAZ olurdu. (Ayni sinif T135'te olculdu: bir kimlik ikinci bir kurali
  # gosterdiginde, kimlige bakan okuyucu YANLIS kurali miras alir.)
  #
  # INV-CATALOG-1 — katalog butunlugu kapisi (T099).
  # Yukaridaki advisor isi TAVSIYE verir (|| true + continue-on-error). Bu is ise
  # gercek bir KAPIDIR: tabanin disinda yeni bir ihlal varsa KIRMIZI olur.
  #
  # NICIN IKI IS: kapi olcemedigi bir durumda ASLA YESIL DONMEMELI. Baglanti dizesi yoksa
  # (ornek: fork PR'i, ya da SUPABASE_DB_URL henuz eklenmemis) kapi isi hic KOSMAZ,
  # GitHub'da "skipped" gorunur. Atlanmis is BASARILI DEGILDIR - kimse onu "olculdu"
  # diye okuyamaz. Eski tasarimda burada `exit 0` vardi ve "OLCULEMEDI" yalnizca bir
  # ETIKETTI; is yesil donuyordu = sessiz fail-open. EDGE (dosya sahibi) bunu yakaladi.
  #
  # Cetvel: docs/standards/catalog-ingestion-standard.md 6.1
  # ---------------------------------------------------------------------------
  db-gate-precheck:
    runs-on: ubuntu-latest
    # PRICING'in ACIK IZNIYLE eklendi (2026-08-19, panoda kayitli). Kendi bulgulari:
    # "benim iki isimde de timeout YOK; is prod DB'ye baglaniyor, havuz asilirsa
    # GitHub varsayilani 6 saat - bugun onardigimiz kilitlenmenin aynisini benim
    # isim uretebilirdi." Bu is bir sir yoklamasi, olculen sure 3 saniye.
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Sirlar var mi
        id: probe
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          # ON-KOSUL TEK: baglanti dizesi. Kok sertifika DEPODA duruyor
          # (scripts/db/checks/supabase-root-2021-ca.pem) - herkese acik bir belge oldugu icin
          # sir olmasi hic gerekmiyordu ve elle yapistirma adimi gercek bir kusur uretti
          # (olculdu: sirra 1366 baytlik YANLIS sertifika dusmustu, gercek kok 2179 bayt).
          # SUPABASE_CA_CERT sirri ARTIK OKUNMUYOR - ne burada ne kapi isinde. Rotasyon, depo
          # dosyasinin gozden gecirilebilir bir commit ile degistirilmesidir; gorunmez bir pano
          # ayari sessizce dogrulanmis dosyanin ustune gecerse tam da onardigimiz kusur geri gelir.
          if [ -n "${DB_URL:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL var -> INV-CATALOG-1 ve INV-RLS-COVERAGE-1 KOSACAK"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=DB KAPILARI ATLANDI::SUPABASE_DB_URL yok -> INV-CATALOG-1 ve INV-RLS-COVERAGE-1 isleri ATLANIYOR. ATLANMIS IS YESIL DEGILDIR: bu kosumda ne katalog butunlugu ne RLS rol kapsami OLCULDU."
          fi

  catalog-integrity:
    needs: db-gate-precheck
    if: needs.db-gate-precheck.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # PRICING izniyle (bkz. precheck). Olculen sure dort kosumda 57-65 saniye.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # --legacy-peer-deps ZORUNLU: depo pnpm ile yonetiliyor ve package.json'da onceden
      # var olan bir peer catismasi bulunuyor (react-day-picker 8 -> date-fns ^2||^3, depoda
      # date-fns 4). pnpm buna izin veriyor, npm vermiyor; bayrak olmadan kurulum patliyor ve
      # kapi VERIYLE ilgisi olmayan bir sebeple kirmizi donuyor. --ignore-scripts: yalnizca
      # surucu gerekiyor, paket yasam-dongusu betikleri kosmasin.
      - name: Install pg driver only
        run: npm install --no-save --no-audit --no-fund --ignore-scripts --legacy-peer-deps pg@8

      - name: Catalog integrity gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          # Kok sertifikanin TEK kaynagi depo dosyasidir. Sir-ustune-gecer secenegini once
          # yazdim, sonra kaldirdim: sirdaki belgenin YANLIS oldugunu zaten olcmustuk, yani
          # sessizce ustune gecen bir sir tam da dogrulanmis dosyayi bozan sey olurdu.
          # Rotasyon bu dosyanin degistirilmesiyle yapilir - gozden gecirilebilir bir commit
          # olarak, gorunmez bir pano ayari olarak degil.
          export PGSSLROOTCERT="scripts/db/checks/supabase-root-2021-ca.pem"
          node scripts/db/checks/catalog-integrity.mjs

      # INV-AILE-KATEGORI-1 (REC-290) — urunun kategorisi ile AILESININ kategorisi ayrismasin.
      #
      # NICIN AYNI ISE BAGLI, ayri is degil: ayni sirri (SUPABASE_DB_URL) ve ayni kok
      # sertifikayi kullaniyor, olcum suresi bir sorgu. Ayri is acmak ayni on-yoklamayi
      # ikinci kez kurmak olurdu; `db-gate-precheck` zaten iki kapiya hizmet ediyor ve
      # yorumu bunu adiyla yaziyor - ucuncusu de ayni cumleye giriyor.
      #
      # NICIN AYRI ADIM (ayni betige eklenmedi): catalog-integrity TABAN dosyasina karsi
      # olcuyor (yeni ihlal var mi); bu kapinin tabani YOK, olcut mutlak sifir. Iki farkli
      # olcut tek betikte yasarsa biri digerinin taban mantigini miras alir.
      #
      # ⛔ADIM SIRASI ANLAMLI: bu adim catalog-integrity'den SONRA. Kirmizi oldugunda
      # kardesinin ciktisi zaten basilmis olur, yani "hangi kapi kirmizi" sorusu logdan
      # tek bakista okunur.
      - name: Aile-kategori tutarlilik kapisi (INV-AILE-KATEGORI-1)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          export PGSSLROOTCERT="scripts/db/checks/supabase-root-2021-ca.pem"
          node scripts/db/checks/aile-kategori-tutarlilik.mjs

      # Kapi TLS yuzunden kirmizi oldugunda, sunucunun GERCEKTEN sundugu zinciri gosterir.
      # NICIN VAR: ayni betik ayni sertifikayla YERELDE calisiyor, CI'da calismiyordu; fark
      # baglanilan SUNUCUDA olmali ve bunu tahminle degil olcumle kapatmak gerekiyor.
      # Yalniz konak adi ve zincirdeki subject/issuer satirlari yazilir - kimlik bilgisi YOK.
      - name: TLS zinciri teshisi (yalniz kapi kirmizi olursa)
        if: failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          HOSTPORT=$(printf '%s' "$SUPABASE_DB_URL" | sed 's#.*@##; s#/.*##; s#?.*##')
          echo "baglanilan sunucu: $HOSTPORT"
          echo | openssl s_client -starttls postgres -connect "$HOSTPORT" -showcerts 2>/dev/null             | grep -E "^ *[0-9]+ s:|^ *[0-9]+ i:" || echo "zincir okunamadi"
          echo "depodaki kok:"
          openssl x509 -in scripts/db/checks/supabase-root-2021-ca.pem -noout -subject -fingerprint -sha256

  # ---------------------------------------------------------------------------
  # INV-RLS-COVERAGE-1 — kodun OKUDUGU ile DB'nin IZIN VERDIGI ayrissin (T161-VH).
  #
  # NICIN CI'YA BAGLANIYOR: kapi #712 ile geldi ama HICBIR is onu cagirmiyordu; yalniz
  # elle kosuluyordu. Elle kosulan kapi, kosulmadigi her gun YOK demektir - ve tam olarak
  # bu kapinin yakaladigi kusur (client_errors) 2026-06-02'den 2026-08-20'ye kadar
  # kimsenin gormedigi bir sessiz-bosluk olarak yasadi.
  #
  # KAPSAM DURUSTLUGU - "bagli" ile "bloklayan" AYNI SEY DEGIL: master dal korumasinin
  # zorunlu baglamlari bugun ["ci","admin-smoke","Vercel"]. Bu is de, kardesi
  # INV-CATALOG-1 de o listede DEGIL; yani kirmizi olduklarinda GORUNURLER ama merge'i
  # mekanik olarak durdurmazlar. Listeye eklemek depo AYARI degisikligidir (Recep kapisi)
  # ve bu PR onu YAPMIYOR - bilerek, cunku iki kapinin da canli davranisi once bir sure
  # gozlenmeli.
  #
  # Betik ayrica kendi KORLUGUNU de olcer: kod taramasi bosalirsa (dizinler tasindi vb.)
  # "ihlal yok" demek yerine cikis 2 ile KIRMIZI doner.
  #
  # Cetvel: scripts/db/checks/rls-role-coverage.mjs bas yorumu + docs/standards/ci-runner-install-standard.md
  # ---------------------------------------------------------------------------
  rls-role-coverage:
    needs: db-gate-precheck
    if: needs.db-gate-precheck.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Olculen is: TEK sorgu + yerel kod taramasi. Sinir yine de ILAN EDILIR - sinirsiz
    # adim yalniz kendi isinin riski degil, paylasilan esszamanlilik havuzunu da yakar
    # (2026-08-19'da bir gunde 34 asili kosum iptal edildi).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Kardes is (catalog-integrity) ile AYNI gerekce: --legacy-peer-deps zorunlu
      # (depoda onceden var olan react-day-picker/date-fns peer catismasi npm'i patlatir),
      # --ignore-scripts ise yalnizca surucu gerektigi icin.
      # ADIM DUZEYINDE zaman siniri: is butcesi 10dk, ama asilan bir kurulum adiminin
      # kendisi daha once olmelidir (ci-runner-install-standard §2 kural 1).
      - name: Install pg driver only
        timeout-minutes: 5
        run: npm install --no-save --no-audit --no-fund --ignore-scripts --legacy-peer-deps pg@8

      - name: RLS role coverage gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          # Kok sertifikanin TEK kaynagi depo dosyasidir (kardes iste gerekcesi yazili).
          export PGSSLROOTCERT="scripts/db/checks/supabase-root-2021-ca.pem"
          node scripts/db/checks/rls-role-coverage.mjs

      # ⭐INV-ANON-YAZMA-1 — NICIN BU ISE EKLENDI, `advisor`a DEGIL (olculdu 2026-09-04):
      # `advisor` isi BILEREK TAVSIYE veriyor (`|| true` + `continue-on-error: true`,
      # satir 153 ve 164'teki gerekce) — yani orada bir adim duserse is YINE YESIL kalir.
      # Nobetciyi oraya koymak "kapi var, koser ama hicbir seyi durdurmaz" sinifi
      # uretirdi. Bu is ise gercek kapi: `set -Eeuo pipefail` + fail-closed betik.
      # Konu da ayni: RLS kapsamasi. Yeni bir is ADI acilmadi — yeni ad, acik PR'lari
      # "beklenen kontrol gelmedi"de kilitler ya da kapinin disinda kalir.
      - name: Anon yazma nobetcisi (INV-ANON-YAZMA-1)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          # Kok sertifikanin TEK kaynagi depo dosyasidir (kardes adimla ayni gerekce).
          export PGSSLROOTCERT="scripts/db/checks/supabase-root-2021-ca.pem"
          node scripts/db/checks/anon-yazma-nobetcisi.mjs

      # ⭐INV-RLS-SARMA-1 — NICIN BU ISE ADIM OLARAK EKLENDI (REC-216):
      # Kardes adim `Anon yazma nobetcisi`nin gerekcesi burada da AYNEN gecerli ve o gerekce
      # zaten yukarida yazili: yeni bir IS ADI acmak acik PR'lari "beklenen kontrol gelmedi"de
      # kilitler ya da kapinin disinda birakir. Konu da ayni is'in konusu: RLS.
      # Ayrica bu adim MEVCUT SUPABASE_DB_URL baglantisini kullanir — YENI BIR ERISIM KARARI
      # GEREKTIRMEZ (olculdu 2026-09-07: bu is bugun PR'larda PASS verdi). REC-138 engel degil.
      #
      # OLCUM (2026-09-07, canli): public semasinda 11 politikanin ifadesi ic ice sarilmisti,
      # en derini 153 katman. Kok sebep supabase/migrations/20250910_rls_initplan_rewrite.sql
      # ve alti kardesi: "idempotent" oldugunu IDDIA eden ama olmayan regexp donusumu.
      # ONARIM MIGRATION'DIR ve Recep kapisidir; bu kapi olcer, onarmaz. Kapi ONCE iner ki
      # onarim indiginde onu tekrar bozulmaktan koruyan bir sey olsun.
      - name: RLS politika sarma kapisi (INV-RLS-SARMA-1)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          # Kok sertifikanin TEK kaynagi depo dosyasidir (kardes adimlarla ayni gerekce).
          export PGSSLROOTCERT="scripts/db/checks/supabase-root-2021-ca.pem"
          node scripts/db/checks/rls-politika-sarma.mjs

      # TLS teshisi BILEREK TEKRARLANMADI: kardes is ayni sunucuya ayni sertifikayla
      # baglaniyor ve zincir teshisini o basiyor. Ayni teshisi iki yere kopyalamak,
      # birini guncelleyip digerini unutmanin davetidir.

  # ---------------------------------------------------------------------------
  # INV-TIP-DRIFT-1 — `src/types/database.types.ts` CANLI SEMAYLA SENKRON MU (REC-121).
  #
  # NICIN CI'YA BAGLANIYOR: kapi #1125 ile geldi ve HICBIR IS ONU CAGIRMIYORDU — yalniz
  # elle kosuluyordu. Bu, kardesi INV-RLS-COVERAGE-1'in bire bir tekrari olurdu: o kapi da
  # #712 ile gelmis, cagiran olmadigi icin yakaladigi kusur (client_errors) 2026-06-02'den
  # 2026-08-20'ye kadar kimsenin gormedigi bir bosluk olarak yasamisti. Elle kosulan kapi,
  # kosulmadigi her gun YOKTUR.
  # Olcum kapinin varlik sebebini de dogruluyor: 2026-09-01'de tipler canli semanin
  # GERISINDEYDI (diff +76/-1) ve 09-07'de HALA geriydi (order_number_counters tablosu,
  # saat tabanli fonksiyon). Migration merge edilince prod'a OTOMATIK uygulaniyor (kural 13);
  # tip dosyasi ELLE uretiliyor. Arada kapi yoktu.
  #
  # ⭐NICIN AYRI IS — ve bu karar kardes adimin KENDI KURALINDAN cikiyor:
  # `Aile-kategori tutarlilik kapisi` adimi ayni ise BAGLANMISTI ve gerekcesi yaziliydi:
  # "ayni sirri (SUPABASE_DB_URL) ve ayni kok sertifikayi kullaniyor". Bu kapi icin o cumle
  # TERSINE doner ve olculdu: tip-drift `pg` surucusu KULLANMAZ, kok sertifika OKUMAZ,
  # SUPABASE_DB_URL'e HIC baglanmaz. Yaptigi is `supabase gen types --project-id` ile
  # Supabase API'sinden tip URETMEK, ve bunun kimligi BASKA bir sirdir: SUPABASE_ACCESS_TOKEN.
  # Farkli kimlik + farkli arac + farkli hata kipi = ayri is. `catalog-integrity` isine
  # eklemek, bu kapinin kosabilmesini ALAKASIZ bir sirrin (DB_URL) varligina baglardi;
  # o sir yoksa tip-drift atlanir ve ATLANAN IS YESIL SANILIR.
  #
  # ⛔KAPSAM DURUSTLUGU — "bagli" ile "bloklayan" AYNI SEY DEGIL: master dal korumasinin
  # zorunlu baglamlari ["ci","admin-smoke","Vercel"]. Bu is de kardesleri gibi o listede
  # DEGIL; kirmizi oldugunda GORUNUR ama merge'i mekanik olarak DURDURMAZ. Listeye eklemek
  # depo AYARI degisikligidir (Recep kapisi) ve bu PR onu YAPMIYOR.
  #
  # ⚠KIRMIZININ MUHATABI BU PR OLMAYABILIR, ve bu satir bilerek burada: drift DEPO
  # DURUMUDUR, PR durumu degil. Bir migration inip tipler yenilenmediyse, o gunden sonraki
  # HER PR'da bu is kirmizi yanar. Onarim `pnpm supabase:gen` ve dosyanin sahibi URUN'dur
  # (AXIOM 3: kapi olcer, onarmaz). Adim ciktisi bunu ADIYLA yazar ki kirmiziyi goren kisi
  # kendi PR'inda sebep aramakla vakit kaybetmesin.
  #
  # Cetvel: scripts/db/checks/tip-drift.mjs bas yorumu · docs/standards/uretilmis-artefakt-standard.md
  # ---------------------------------------------------------------------------
  tip-drift-precheck:
    runs-on: ubuntu-latest
    # Bir sir yoklamasi; kardesiyle ayni gerekce (PRICING'in timeout bulgusu).
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Sir var mi (SUPABASE_ACCESS_TOKEN)
        id: probe
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          # ⛔AYRI ON-YOKLAMA, `db-gate-precheck`e EKLENMEDI: o is DB_URL'i olcuyor ve iki
          # kapiya hizmet ediyor. Ucuncu kapinin onkosulu BASKA bir sir; ayni ise koymak
          # "DB_URL var ama ACCESS_TOKEN yok" halinde isi KOSTURUR ve is, sir yokluguyla
          # ilgisi olmayan bir hatayla (supabase CLI oturum acamadi) kirmizi doner —
          # yani ATLANMASI gereken bir olcum, ARIZA gibi gorunur.
          # Fork PR'larinda sirlar YOKTUR: orada bu is ATLANIR ve atlandigi SOYLENIR.
          if [ -n "${ACCESS_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN var -> INV-TIP-DRIFT-1 KOSACAK"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=TIP-DRIFT KAPISI ATLANDI::SUPABASE_ACCESS_TOKEN yok -> INV-TIP-DRIFT-1 ATLANIYOR. ATLANMIS IS YESIL DEGILDIR: bu kosumda tip dosyasinin canli semayla senkron olup olmadigi OLCULMEDI."
          fi

  tip-drift:
    needs: tip-drift-precheck
    if: needs.tip-drift-precheck.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Yerel olcum 2026-09-08: 62 tablo/786 kolon iki tarafta, kosum ~40 sn (CLI indirmesi
    # dahil). Tavan genis tutuldu cunku `npx supabase@latest` indirmesi ag hizina bagli;
    # ama SINIRSIZ birakilmaz - PRICING'in bulgusu: timeout'suz is havuz asilirsa
    # GitHub varsayilaniyla 6 saat asili kalir.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ⛔`Install pg driver only` adimi BILEREK YOK: bu betik `pg` KULLANMAZ. Kardes
      # islerden kopyalanan gereksiz bir kurulum, kapinin kirmizisini kendi bagimliligiyla
      # kirletir (npm peer catismasi yuzunden kirmizi = VERIYLE ilgisi olmayan kirmizi).
      - name: Tip-drift kapisi (INV-TIP-DRIFT-1)
        env:
          # `supabase gen types --project-id` Supabase API'sine baglanir; kimligi budur.
          # Proje kimligi SIR DEGIL ve ortamdan OKUNMAZ: betik onu package.json'daki
          # `supabase:gen` komutundan cikarir, boylece kapi ile uretim AYNI projeyi olcer.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "NOT: bu kapi DEPO DURUMUNU olcer, bu PR'in degisikligini degil."
          echo "     Kirmizi olursa onarim: pnpm supabase:gen (dosya sahibi URUN, AXIOM 3)."
          node scripts/db/checks/tip-drift.mjs
