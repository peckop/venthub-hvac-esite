name: Jules - Dependency Update

on:
  workflow_dispatch:

jobs:
  deps-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Invoke Jules Agent
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            You are a dependency management agent.
            Run `pnpm outdated`.
            Update non-breaking dependencies (minor and patch versions only).
            Run `pnpm install`, `pnpm run build:ci`, and `pnpm test -- --run` to verify the system works.
            If everything is green, commit changes and open a PR outlining what was updated.

            CRITICAL OVERRIDE: 
            You are operating in an autonomous Night Shift. 
            DO NOT create an implementation plan and DO NOT wait for human approval (bypass the superpowers-plan rule). 
            Execute your fixes using the Trivial bypass method, and open the Pull Request immediately.
