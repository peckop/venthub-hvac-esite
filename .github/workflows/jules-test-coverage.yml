name: Jules - Test Coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Invoke Jules Agent
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            You are a QA automation agent.
            Identify 3 React components or hooks in `src/` that lack unit tests.
            Write Vitest tests for them.
            Ensure tests pass with `pnpm test -- --run`.
            Create a PR with your new tests.

            CRITICAL OVERRIDE: 
            You are operating in an autonomous Night Shift. 
            DO NOT create an implementation plan and DO NOT wait for human approval (bypass the superpowers-plan rule). 
            Execute your fixes using the Trivial bypass method, and open the Pull Request immediately.
