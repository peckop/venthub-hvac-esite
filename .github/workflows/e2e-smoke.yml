name: E2E Smoke (admin + checkout)

# Runtime smoke — donma/loop bekçisi (2026-06-19 useRole render-loop sınıfı).
#
# 2026-08-15: kapsam GENİŞLEDİ. `checkout-smoke.e2e.ts` karantinadan çıktı (fiyat motoru
# seed'i koştu, 348 ürün satın alınabilir) ve `playwright test` tüm spec'leri topladığı için
# bu job artık satınalma hunisini de koşuyor. Ödeme yolu aynı gün fail-closed yapıldı
# (T041-VH); o mantıktaki bir hata checkout'u tamamen öldürür ve statik kapılar GÖRMEZ.
#
# ⚠️ JOB ID'Sİ `admin-smoke` OLARAK KALIYOR — adı artık kapsamı tam anlatmıyor ama
# branch protection bu adı ZORUNLU kontrol olarak bekliyor. Yeniden adlandırmak her açık
# PR'ı "beklenen kontrol gelmedi" ile kilitler. Ad değişecekse önce branch protection
# kuralı güncellenmeli, sonra job — bu sırayla.
# Ayrı workflow: ana CI'ı bloklamaz; oturana kadar iterasyon, sonra istenirse required yapılır.

on:
  pull_request:
# ⚠️ `push.branches` KASITEN yalnız master.
# Eskiden `['**']` yazıyordu ve `pull_request` ile BİRLİKTE ateşliyordu: dal push'landığında
# AYNI commit iki kez test ediliyordu (kontrol listesinde `ci` ve `admin-smoke`'un ikişer
# görünmesinin sebebi buydu). Repo PRIVATE olduğu için Actions dakikaları ücretli —
# yani bu, kapsam kazandırmadan faturayı ~2 katına çıkaran saf israftı ve
# 2026-08-15'te hesabın iş başlatmayı reddetmesine katkı verdi.
# Kapsam kaybı YOK: dal push'unda `pull_request` koşar, master'da `push` koşar.
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --prefer-offline --config.allow-scripts true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (real Supabase env)
        run: pnpm run build:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}

      - name: Run smoke suite (admin + checkout)
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # middleware artık bu sır yoksa admin'i FAIL-CLOSED reddediyor (anon key fallback'i kaldırıldı).
          # Buradaki değer efemer CI sunucusunun çerezlerini şifreler — üretim sırrı DEĞİL.
          # Repo/organizasyonda gerçek bir secret tanımlıysa o kullanılır.
          JWT_CLAIMS_COOKIE_SECRET: ${{ secrets.JWT_CLAIMS_COOKIE_SECRET || 'e2e-ephemeral-ci-claims-key-not-a-production-secret' }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
