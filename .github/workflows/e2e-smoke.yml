name: E2E Smoke (admin)

# Admin runtime smoke — donma/loop bekçisi (2026-06-19 useRole render-loop sınıfı).
# Ayrı workflow: ana CI'ı bloklamaz; oturana kadar iterasyon, sonra istenirse required yapılır.

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --prefer-offline --config.allow-scripts true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (real Supabase env)
        run: pnpm run build:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}

      - name: Run admin smoke
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
