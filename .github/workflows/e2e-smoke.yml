name: E2E Smoke (admin + checkout)

# Runtime smoke — donma/loop bekçisi (2026-06-19 useRole render-loop sınıfı).
#
# 2026-08-15: kapsam GENİŞLEDİ. `checkout-smoke.e2e.ts` karantinadan çıktı (fiyat motoru
# seed'i koştu, 348 ürün satın alınabilir) ve `playwright test` tüm spec'leri topladığı için
# bu job artık satınalma hunisini de koşuyor. Ödeme yolu aynı gün fail-closed yapıldı
# (T041-VH); o mantıktaki bir hata checkout'u tamamen öldürür ve statik kapılar GÖRMEZ.
#
# ⚠️ JOB ID'Sİ `admin-smoke` OLARAK KALIYOR — adı artık kapsamı tam anlatmıyor ama
# branch protection bu adı ZORUNLU kontrol olarak bekliyor. Yeniden adlandırmak her açık
# PR'ı "beklenen kontrol gelmedi" ile kilitler. Ad değişecekse önce branch protection
# kuralı güncellenmeli, sonra job — bu sırayla.
# Ayrı workflow: ana CI'ı bloklamaz; oturana kadar iterasyon, sonra istenirse required yapılır.

on:
  pull_request:
# ⚠️ `push.branches` KASITEN yalnız master.
# Eskiden `['**']` yazıyordu ve `pull_request` ile BİRLİKTE ateşliyordu: dal push'landığında
# AYNI commit iki kez test ediliyordu (kontrol listesinde `ci` ve `admin-smoke`'un ikişer
# görünmesinin sebebi buydu). Repo PRIVATE olduğu için Actions dakikaları ücretli —
# yani bu, kapsam kazandırmadan faturayı ~2 katına çıkaran saf israftı ve
# 2026-08-15'te hesabın iş başlatmayı reddetmesine katkı verdi.
# Kapsam kaybı YOK: dal push'unda `pull_request` koşar, master'da `push` koşar.
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # ══════════════════════════════════════════════════════════════════════
      # ELLE TETİKLEMEDE DE MERGE-REF TEST EDİLİR (T066-VH, 2026-08-16)
      # Gerekçenin tamamı `ci.yml`'deki eşi adımda. Özet: `admin-smoke` bir REQUIRED
      # STATUS CHECK ve GitHub bunları ADA göre eşler; `workflow_dispatch` ile elle
      # koşturulan bir yeşil de merge'i açar, ama dispatch dalın UCUNU checkout eder,
      # `pull_request` ise merge-ref'i. Yani elle alınan yeşil, master'la birleşik
      # hâli hiç test etmemiş olabilir. Job ADI bilerek değişmedi.
      - name: Merge-ref çözümle (yalnız elle tetiklemede)
        id: mergeref
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "master — merge-ref yok, varsayılan checkout"; exit 0
          fi
          sayi=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" \
                   --state open --json number --jq 'length')
          if [ "$sayi" -eq 0 ]; then
            echo "::notice::Açık PR yok — dal ucu test edilecek."
            exit 0
          fi
          if [ "$sayi" -gt 1 ]; then
            echo "::error::Bu dal için $sayi açık PR var; merge-ref belirsiz. Elle koşum durduruldu."
            exit 1
          fi
          pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" \
                 --state open --json number --jq '.[0].number')
          echo "ref=refs/pull/${pr}/merge" >> "$GITHUB_OUTPUT"
          echo "::notice::PR #${pr} merge-ref'i test edilecek (dal ucu DEĞİL)."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.mergeref.outputs.ref || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --prefer-offline --config.allow-scripts true

      # ══════════════════════════════════════════════════════════════════════
      # KURULUM ADIMI SINIRLANDI (2026-08-19, üç bağımsız koşumla ölçüldü)
      #
      # Eski hâli tek satırdı: `playwright install --with-deps chromium`. O satır
      # 32225114226 · 32225609438 · 32224496574 koşumlarında ~24,5 dakika asılı
      # kalıp 25 dakikalık iş bütçesini yedi. Asılan kısım tarayıcı indirmesi
      # DEĞİLDİ — `--with-deps`'in çağırdığı apt'ydi (günlükte azure aynası
      # erişilemiyor, archive.ubuntu.com'a düşüyor ve 24 dakika tek satır çıktı
      # üretmiyor). Sağlıklı koşumda aynı adım 1dk18sn: apt ~70sn, tarayıcı ~8sn.
      #
      # Bu yüzden adım ÜÇE bölündü ve her parça kendi başına sınırlandı:
      #   1) apt yapılandırması  → asılma yerine zaman aşımı
      #   2) sistem bağımlılıkları (apt) → sınırlı + tekrarlı
      #   3) tarayıcı indirmesi (CDN)    → sınırlı + tekrarlı, önbellekli
      # `timeout-minutes` ikinci kemerdir: betik bozulursa iş bütçesini yemesin.
      # ══════════════════════════════════════════════════════════════════════
      - name: apt sertlestirmesi
        timeout-minutes: 3
        run: bash scripts/ci/apt-hardening.sh

      - name: Playwright tarayici onbellegi
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # ── KEMER ARITMETIGI (ilk surumde YANLISTI, duzeltildi) ──────────────
      # `timeout-minutes` sarmalayicinin EN KOTU suresini GECMELI, yoksa dis kemer
      # icteki denemeyi keser. Ilk surum 300sn x 3 deneme (en kotu 920sn = 15,3dk)
      # yaziyor ama adima 12 dakika veriyordu: ucuncu deneme HIC kosamazdi.
      #
      # Ikinci kisit: adim sinirlarinin TOPLAMI is butcesini (25dk) asmamali, yoksa
      # sinirlama isi kurtarmaz - yine 25 dakika yanar. Bu yuzden deneme sayisi 3'ten
      # 2'ye indi: 300sn x 2 + 10sn = 610sn = 10,2dk -> adim siniri 11dk.
      # Iki kurulum adimi = en kotu 22dk < 25dk. Saglikli deger 47 saniye, yani
      # 300 saniyelik sinir zaten 6 kat pay birakiyor; ucuncu deneme pay degil kumardi.
      # ── EN IYI CABA + GERCEK YETENEK KAPISI (2026-08-19, master'da olculdu) ──
      # Bu adım artık işi DÜŞÜRMEZ. Gerekçe ölçüme dayanıyor: master a8854cf7
      # koşumunda apt iki denemede de 300 saniyeyi doldurdu, üçüncüsü kesildi ve
      # `admin-smoke` KIRMIZI yandı — hâlbuki asıl soru "apt geçti mi" değil,
      # "TARAYICI AÇILIYOR MU". Koşucu imajında gerekli kütüphaneler zaten varsa
      # apt'nin düşmesi hiçbir şeyi bozmaz; yoksa aşağıdaki prob bunu ADIYLA söyler.
      #
      # Bu fail-open DEĞİL: kapı bir vekilden (apt çıkış kodu) ASIL ŞEYE (Chromium
      # gerçekten açılıyor mu) taşındı ve asıl şey daha güçlü bir iddiadır.
      - name: Playwright sistem bagimliliklari (en iyi caba)
        continue-on-error: true
        timeout-minutes: 11
        env:
          RETRY_APT_TEMIZLE: '1'
        run: bash scripts/ci/retry-bounded.sh 300 2 -- pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        timeout-minutes: 11
        run: bash scripts/ci/retry-bounded.sh 300 2 -- pnpm exec playwright install chromium

      # GERÇEK KAPI: sistem bağımlılıkları eksikse Chromium burada açılmaz ve iş
      # ADIYLA düşer. "apt geçti" demek tarayıcının çalıştığını kanıtlamaz; bu adım
      # kanıtlar. Ucuz (~5 sn) ve teşhis mesajı net.
      - name: Tarayici gercekten aciliyor mu
        timeout-minutes: 3
        run: |
          node -e "
          const { chromium } = require('@playwright/test')
          chromium.launch()
            .then(async (b) => {
              const p = await b.newPage()
              await p.setContent('<h1>ok</h1>')
              const t = await p.textContent('h1')
              await b.close()
              if (t !== 'ok') throw new Error('sayfa render etmedi')
              console.log('tarayici-probu: Chromium acildi ve sayfa render etti')
            })
            .catch((e) => {
              console.error('::error::Chromium ACILAMADI: ' + e.message)
              console.error('::error::Sistem bagimliliklari gercekten eksik — apt adimi bu kez KRITIK.')
              process.exit(1)
            })
          "

      - name: Build (real Supabase env)
        run: pnpm run build:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}

      - name: Run smoke suite (admin + checkout)
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # middleware artık bu sır yoksa admin'i FAIL-CLOSED reddediyor (anon key fallback'i kaldırıldı).
          # Buradaki değer efemer CI sunucusunun çerezlerini şifreler — üretim sırrı DEĞİL.
          # Repo/organizasyonda gerçek bir secret tanımlıysa o kullanılır.
          JWT_CLAIMS_COOKIE_SECRET: ${{ secrets.JWT_CLAIMS_COOKIE_SECRET || 'e2e-ephemeral-ci-claims-key-not-a-production-secret' }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
