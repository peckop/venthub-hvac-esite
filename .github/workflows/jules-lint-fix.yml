name: Jules - Lint & TS Fixer

on:
  schedule:
    - cron: '0 3,9,12,15,21 * * *' # TR Saatiyle: 06:00, 12:00, 15:00, 18:00, 00:00
  workflow_dispatch:

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Invoke Jules Agent
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            You are a code maintenance agent.
            Run `pnpm run lint` and `pnpm exec tsc -b tsconfig.build.json`.
            Identify static analysis and type errors.
            Fix them carefully without altering business logic.
            Re-run the checks to verify.
            If successful, commit the changes and create a PR.
