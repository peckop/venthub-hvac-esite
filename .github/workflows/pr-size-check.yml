name: 📏 PR Boyut Kontrolü

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  size-check:
    name: Boyut Denetle
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: PR satır sayısını kontrol et
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            const WARN_THRESHOLD  = 150;
            const BLOCK_THRESHOLD = 300;

            // Önceki bot yorumunu sil (güncelleme durumunda)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.includes('📏 PR Boyut Raporu')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Yorum yalnızca eşik aşılırsa oluşturulur
            if (total < WARN_THRESHOLD) {
              console.log(`✅ PR boyutu kabul edilebilir: ${total} satır`);
              return;
            }

            const isBlocking = total >= BLOCK_THRESHOLD;
            const icon  = isBlocking ? '🚨' : '⚠️';
            const level = isBlocking ? 'BÜYÜK' : 'ORTA';

            const body = [
              `## 📏 PR Boyut Raporu`,
              ``,
              `${icon} **Bu PR ${level} boyutta (${total} satır değişiklik).**`,
              ``,
              `| Metrik     | Değer |`,
              `|------------|-------|`,
              `| ➕ Eklenen | ${additions} satır |`,
              `| ➖ Silinen | ${deletions} satır |`,
              `| 📊 Toplam  | **${total} satır** |`,
              ``,
              isBlocking
                ? `🚫 **${BLOCK_THRESHOLD}+ satır:** Bu PR'ı daha küçük parçalara bölmek şiddetle önerilir.`
                : `⚠️ **${WARN_THRESHOLD}+ satır:** Mümkünse bu PR'ı parçalara bölmeyi değerlendirin.`,
              ``,
              `> 📌 VentHub kuralı: Tek PR maksimum 100 satır hedeflenir. (AGENTS.md §6)`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

            if (isBlocking) {
              core.warning(`PR boyutu çok büyük: ${total} satır (eşik: ${BLOCK_THRESHOLD})`);
            }
