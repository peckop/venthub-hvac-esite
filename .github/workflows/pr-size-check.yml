name: 📏 PR Boyut Kontrolü

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  size-check:
    name: Boyut Denetle
    runs-on: ubuntu-latest
    permissions:
      contents: read # private repo: bu satır olmadan checkout 'Repository not found' verir (2026-08-14)
      pull-requests: write

    steps:
      # Büyük-dosya guard'ı: 225MB'lik .cc/memory.db sessizce şişip GitHub'ın 100MB
      # push limitine çarpmadan yakalansın (code-review bulgusu, 2026-08-13).
      # Tüm takipli ağaç taranır (yalnız diff değil) — sınır 50MB.
      - name: Checkout (büyük-dosya taraması için)
        uses: actions/checkout@v4

      - name: Büyük dosya taraması (>50MB = FAIL)
        shell: bash
        run: |
          LIMIT=$((50 * 1024 * 1024))
          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$LIMIT" ]; then
              echo "::error file=$f::Takipli dosya ${size} bayt (>50MB) — repo'ya girmemeli (gitignore/untrack)."
              FAIL=1
            fi
          done < <(git ls-files)
          exit $FAIL

      - name: PR satır sayısını kontrol et
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            const WARN_THRESHOLD  = 150;
            const BLOCK_THRESHOLD = 300;

            // Önceki bot yorumunu sil (güncelleme durumunda)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.includes('📏 PR Boyut Raporu')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Yorum yalnızca eşik aşılırsa oluşturulur
            if (total < WARN_THRESHOLD) {
              console.log(`✅ PR boyutu kabul edilebilir: ${total} satır`);
              return;
            }

            const isBlocking = total >= BLOCK_THRESHOLD;
            const icon  = isBlocking ? '🚨' : '⚠️';
            const level = isBlocking ? 'BÜYÜK' : 'ORTA';

            const body = [
              `## 📏 PR Boyut Raporu`,
              ``,
              `${icon} **Bu PR ${level} boyutta (${total} satır değişiklik).**`,
              ``,
              `| Metrik     | Değer |`,
              `|------------|-------|`,
              `| ➕ Eklenen | ${additions} satır |`,
              `| ➖ Silinen | ${deletions} satır |`,
              `| 📊 Toplam  | **${total} satır** |`,
              ``,
              isBlocking
                ? `🚫 **${BLOCK_THRESHOLD}+ satır:** Bu PR'ı daha küçük parçalara bölmek şiddetle önerilir.`
                : `⚠️ **${WARN_THRESHOLD}+ satır:** Mümkünse bu PR'ı parçalara bölmeyi değerlendirin.`,
              ``,
              `> 📌 VentHub kuralı: Tek PR maksimum 100 satır hedeflenir. (AGENTS.md §6)`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

            if (isBlocking) {
              core.warning(`PR boyutu çok büyük: ${total} satır (eşik: ${BLOCK_THRESHOLD})`);
            }
