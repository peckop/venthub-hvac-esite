name: CI

on:
  pull_request:
    # `edited` ŞART (karar 187): PR gövdesine `Fixes REC-nn` sonradan eklenince kayıt kapısı
    # yeniden koşmalı; aksi halde yazar boş commit atmak zorunda kalır. Varsayılan tür listesi
    # (opened, synchronize, reopened) korunur, yalnız `edited` eklenir.
    types: [opened, synchronize, reopened, edited]
# ⚠️ `push.branches` KASITEN yalnız master.
# Eskiden `['**']` yazıyordu ve `pull_request` ile BİRLİKTE ateşliyordu: dal push'landığında
# AYNI commit iki kez test ediliyordu (kontrol listesinde `ci` ve `admin-smoke`'un ikişer
# görünmesinin sebebi buydu). Repo PRIVATE olduğu için Actions dakikaları ücretli —
# yani bu, kapsam kazandırmadan faturayı ~2 katına çıkaran saf israftı ve
# 2026-08-15'te hesabın iş başlatmayı reddetmesine katkı verdi.
# Kapsam kaybı YOK: dal push'unda `pull_request` koşar, master'da `push` koşar.
  push:
    branches: [master]
  workflow_dispatch:

# ALT-38: `edited` (PR başlığı/gövdesi düzenleme) AYRI grupta. Kod değişmedi; koşan TAM koşuyu İPTAL ETMEMELİ.
# Ölçüldü (10-03..10-06): 187 PR koşusunun 50'si aynı commit'in tekrarıydı, 30'u iptal edilen bir koşudan sonra geldi.
# `push` ve `workflow_dispatch` olaylarında `github.event.action` yoktur (boş): grup eskisiyle AYNI kalır.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'edited' && '-edited' || '' }}
  cancel-in-progress: true

# Depo PUBLIC: `permissions:` yazılınca varsayılanlar düşer, `contents: read` ZORUNLU (CLAUDE.md Notlar).
# `actions: read` YALNIZ edited aynasının (scripts/ci/edited-ayna.cjs) önceki koşuları okuması içindir;
# hiçbir yazma yetkisi verilmez (PR kayıt kapısı etiket yazmaz, bilerek). `pull-requests: read`: elle tetiklemede
# `gh pr list` (merge-ref çözümü).
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # `edited` koşusu tam koşunun bitmesini bekleyebilir (en çok 11 dk) ve gerekirse paketin tamamını koşar.
    timeout-minutes: ${{ github.event.action == 'edited' && 30 || 15 }}
    # KRİTİK: GitHub Actions'ın örtük varsayılanı `bash -e` — pipefail YOK.
    # Adımlar `... 2>&1 | tee X.log` şeklinde olduğu için exit kodu tee'den geliyordu
    # (her zaman 0) → Lint/Type check/Test/Build/Deno check adımlarının HİÇBİRİ
    # bloklamıyordu. Açık `shell: bash` pipefail'i devreye alır ve kapıları gerçek yapar.
    defaults:
      run:
        shell: bash
    steps:
      # ══════════════════════════════════════════════════════════════════════
      # ELLE TETİKLEMEDE DE MERGE-REF TEST EDİLİR (T066-VH, 2026-08-16)
      #
      # `ci` bir REQUIRED STATUS CHECK. GitHub bunları **ADA** göre eşler, tetikleyici
      # olayına göre değil — yani `workflow_dispatch` ile elle koşturulan bir `ci`
      # koşusu da branch protection'ı açar.
      #
      # Sorun buradaydı: `actions/checkout` varsayılanı olay-bağımlıdır.
      #   · `pull_request` → `refs/pull/N/merge` (PR head + base BİRLEŞİK ağaç)
      #   · `workflow_dispatch` → dalın UCU (base hiç karışmaz)
      #
      # Yani elle alınan yeşil, "bu dal kendi başına geçiyor" der; "master'la
      # birleştiğinde geçiyor" DEMEZ. Oysa required check'in vaat ettiği tam olarak
      # ikincisidir. Ölçüldü (2026-08-16): PR #557'de otomatik kontroller açılışta hiç
      # ateşlenmedi, `workflow_dispatch` ile elle koşuldu ve o yeşil merge'i açtı —
      # master'la birleşik hâl bir kez bile test edilmeden.
      #
      # Çözüm, kaçış kapısını KAPATMAK değil (o kapı gerçekten gerekliydi): dispatch
      # sırasında açık bir PR varsa merge-ref'e geç. Job ADI değişmez — değişse
      # branch protection'daki tüm açık PR'lar "beklenen kontrol gelmedi"de kilitlenirdi.
      - name: Merge-ref çözümle (yalnız elle tetiklemede)
        id: mergeref
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # master'da (ya da PR'sız bir dalda) elle koşmak meşrudur; orada üzerine
          # bindirilecek bir base yok, varsayılan checkout doğrudur.
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "master — merge-ref yok, varsayılan checkout"; exit 0
          fi
          sayi=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" \
                   --state open --json number --jq 'length')
          if [ "$sayi" -eq 0 ]; then
            echo "::notice::Açık PR yok — dal ucu test edilecek."
            exit 0
          fi
          # Birden çok açık PR varsa hangisinin merge-ref'i doğru olduğu BELİRSİZ.
          # Rastgele birini seçmek, yanlış base'e karşı yeşil üretebilir → dur.
          if [ "$sayi" -gt 1 ]; then
            echo "::error::Bu dal için $sayi açık PR var; merge-ref belirsiz. Elle koşum durduruldu."
            exit 1
          fi
          pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" \
                 --state open --json number --jq '.[0].number')
          echo "ref=refs/pull/${pr}/merge" >> "$GITHUB_OUTPUT"
          echo "::notice::PR #${pr} merge-ref'i test edilecek (dal ucu DEĞİL)."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Boş dize = varsayılan davranış (pull_request'te zaten merge-ref).
          # Yalnız elle tetiklemede ve açık PR varken dolu gelir.
          ref: ${{ steps.mergeref.outputs.ref || '' }}
          # TAM GEÇMİŞ — sebep ADIYLA: `INV-DOC-2` companion parite bekçisi (#616) yaş
          # ölçümünü `git log --name-only` ile yapar. `actions/checkout` varsayılanı
          # `fetch-depth: 1`'dir; sığ klonda o bekçi geçmişi göremez ve **bilerek**
          # kırmızı yanar (no-grace: yeni kapıya "uyar-geç" modu konmaz).
          #
          # ÖLÇÜLDÜ (2026-08-17, bu satır eklenmeden önce): bugünkü master'da geçmiş
          # okuyan HİÇBİR kapı yok — `companion-doc-parity` ve `eol-normalization`
          # `git ls-files` kullanır, o da INDEX'i okur ve sığ klonda eksiksizdir.
          # Yani bu satır bugünü düzeltmiyor; #616 ile GELEN ihtiyacı karşılıyor.
          # Gerekçeyi "ihtiyaten" diye yazmamak bilinçli: sahte teknik sebep, bir
          # sonraki okuyanı yanlış yere bakmaya iter.
          #
          # NİÇİN HEDEFLİ DEĞİL DE TÜM JOB: bu workflow TEK job (`ci`) içeriyor;
          # conformance'ı ayrı job'a bölmek ya zorunlu kontrolün ADINI değiştirir
          # (açık tüm PR'lar "beklenen kontrol gelmedi"de kilitlenir) ya da
          # conformance'ı zorunlu kapının DIŞINA taşır. İkisi de bedeli tam klondan
          # ağır. Geçmiş isteyen diğer workflow'larda (deploy-functions, rls-guard)
          # bu satır zaten var — desen korunuyor.
          fetch-depth: 0

      # ALT-38 · B1 (güvenlik incelemesi) — TABAN İZİ: bu koşunun test ettiği taban = merge-ref'in birinci ebeveyni.
      # `edited` aynası (aşağıda) yalnız AYNI head SHA'ya ve AYNI tabana karşı bitmiş yeşil bir tam koşuya dayanır: aynı SHA'lı
      # başka PR'ın koşusu ya da PR'ın tabanı değiştirilerek (`gh pr edit --base`) test edilmemiş birleşim atlatılamaz.
      # İz adım ADINA yazılır (ek izin gerekmez; ayna aynı işler API'sini zaten okur): adın başı `taban izi `, devamı 40 haneli SHA.
      # Ad ve sıra INV-CI-EDITED-1 ile sabit; iz yoksa ya da uymuyorsa ayna TAM koşu der (güvenli taraf).
      - name: Taban SHA'sı (merge-ref birinci ebeveyn)
        id: taban
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: taban izi ${{ steps.taban.outputs.sha }}
        if: github.event_name == 'pull_request'
        run: echo "iz bu adımın ADINDA (scripts/ci/edited-ayna.cjs izTabani)"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      # `id: node`: belge hızlı yolunda kurulum yalnız pnpm deposu önbelleği İSABET ettiyse atlanır (`cache-hit` çıktısı, aşağıda `Install dependencies`).
      - name: Setup Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # Karar 187 (REC-433) + karar 219/220 (ARC-2): her PR bir iş kaydına bağlanır. Gövdede `Kanban: <ÖN EK>-<sayı>`
      # (ör. `Kanban: ARC-3`, taşınan kayıt `Kanban: REC-nn`) yoksa KIRMIZI; eski yol `Fixes REC-nn` / `Kayıtsız: <sebep>`
      # 2026-10-08 dahil kabul. Mantığı ve testi: scripts/board/pr-kayit-kapisi.cjs (ARAÇ).
      # Yalnız pull_request olayında koşar (push/master ve elle koşumda PR gövdesi yoktur).
      # Kurulumdan ÖNCE durur: bağımlılıksız, saniyeler sürer, boşuna 15 dakikalık kontrol koşturmaz.
      # PR gövdesi ve yazar ORTAM DEĞİŞKENİ olarak geçer, `run:` satırına gömülmez (enjeksiyon).
      # Yeni sır yok: LINEAR_API_KEY CI'da tanımlı değildir, çatı kontrolü "ölçülemedi" der, kırmızı yapmaz.
      # Etiket yazan adım BİLEREK yok: zorunlu `ci` işine `pull-requests: write` vermek, PR'ın kendi
      # kodunu koşturan işi gereksiz yetkilendirir. İstisnalar gövdedeki `Kayıtsız:` ifadesiyle sayılır.
      - name: PR kayıt kapısı (karar 187)
        if: github.event_name == 'pull_request'
        env:
          PR_GOVDE: ${{ github.event.pull_request.body }}
          PR_YAZAR: ${{ github.event.pull_request.user.login }}
        run: node scripts/board/pr-kayit-kapisi.cjs

      # ALT-38 — `edited` AYNASI (cetvel: docs/standards/test-karnesi-standard.md §4; mantık ve test: scripts/ci/edited-ayna.cjs).
      # Yalnız PR düzenlemesinde koşar. Aynı head SHA için bu koşudan ÖNCE başlamış bir TAM koşu `success` ile bitmişse ve
      # o koşunun `taban izi` bu koşunun tabanıyla (HEAD^1) BİREBİR aynıysa ağır adımlar ATLANIR (kod ve taban aynı: gerçek
      # yeşile dayanır); tam koşu sürüyorsa bitmesi BEKLENİR; kırmızı/iptal/belirsiz/hata/iz yok durumunda TAM koşu yapılır.
      # Bir düzenleme kırmızı bir koşuyu yeşile ÇEVİREMEZ. PR kayıt kapısı yukarıda bu adımdan ÖNCE ve HER ZAMAN koşar.
      # Adın BAŞI kod ile birebir aynı olmalı (INV-CI-EDITED-1): ayna koşusunu bu adımın sonucundan tanıyoruz.
      # B2: karar betiği PR'ın KENDİ kopyasından DEĞİL, TABANDAN (HEAD^1) çıkarılıp koşar; PR betiği değiştirip kendi
      # kırmızısını atlatamaz. Taban kopyası yoksa (mekanizma henüz tabanda değil) TAM koşu. Taban dalı bu düzenlemede
      # değiştiyse (`changes.base` dolu → TABAN_DEGISTI) betik doğrudan TAM der (B1).
      - name: edited ayna kararı
        id: ayna
        if: github.event_name == 'pull_request' && github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KOSU_ID: ${{ github.run_id }}
          TABAN_DEGISTI: ${{ github.event.changes.base && 'true' || '' }}
        run: |
          if ! git show HEAD^1:scripts/ci/edited-ayna.cjs > "$RUNNER_TEMP/edited-ayna.cjs" 2>/dev/null; then
            echo "::notice::edited ayna: TAM KOŞU — taban kopyası yok (HEAD^1:scripts/ci/edited-ayna.cjs)"
            printf 'atla=false\nneden=taban kopyası yok\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$RUNNER_TEMP/edited-ayna.cjs"

      # ALT-38c — DEĞİŞİKLİK SINIFI (cetvel: docs/standards/test-karnesi-standard.md; mantık ve test: scripts/ci/degisiklik-sinifi.cjs).
      # PR'ın değişen dosyalarının TÜMÜ dar sınıflardaysa (belge, edge, betik, karma) `next build` girdisine dokunulmamıştır (ölçüldü:
      # src/ ve next.config.mjs src/ dışına import etmez; build-sırası betikleri tam listededir) ve `Build (blocking)` ATLANIR; e2e-smoke.yml
      # aynı kararı kendi işinde verir. TEST adımı HİÇBİR sınıfta atlanmaz (kapsam kaybı sıfır: testlerin %90'ı dosya okuyan kapılardır).
      # Sınıflayıcı TABANDAN çıkarılıp koşar (edited ayna ile aynı güven sınırı: PR betiği değiştirip kendi kararını veremez); taban kopyası yoksa
      # `tam` yazılır. Çıktı boş/eksik/bilinmiyorsa HER ŞEY koşar (koşullar yalnız DARALTMA yönünde: bkz. Build koşulu). Sınıflayıcı tümden ÇÖKERSE
      # (sözdizimi hatası, bellek, sinyal: kendi son sigortasının da aştığı durum) adım `tam` yazıp uyarır: KIRMIZI değil, tam paket koşar; aksi halde
      # tabandaki sınıflayıcı bozulduğunda onu düzelten PR de aynı bozuk kopyayı koşup kırmızı kalır (kilitlenme). Adım yalnız pull_request'te
      # koşar: master push ve elle koşum her zaman TAM paketi koşar. Adın, sırası ve gövdesi INV-CI-EDITED-1 ve INV-CI-SINIF-1/3 ile sabit.
      - name: Değişiklik sınıfı (siteye dokunmayan PR'da Build atlanır)
        id: sinif
        if: github.event_name == 'pull_request'
        run: |
          if ! git show HEAD^1:scripts/ci/degisiklik-sinifi.cjs > "$RUNNER_TEMP/degisiklik-sinifi.cjs" 2>/dev/null; then
            echo "::notice::değişiklik sınıfı: tam — taban kopyası yok (HEAD^1:scripts/ci/degisiklik-sinifi.cjs)"
            printf 'sinif=tam\nneden=taban kopyası yok\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cikis=0
          node "$RUNNER_TEMP/degisiklik-sinifi.cjs" || cikis=$?
          if [ "$cikis" -ne 0 ]; then
            echo "::warning::değişiklik sınıfı: tam — sınıflayıcı çöktü (çıkış kodu $cikis), tam paket koşar"
            printf 'sinif=tam\nneden=sınıflayıcı çöktü, çıkış kodu %s\n' "$cikis" >> "$GITHUB_OUTPUT"
          fi

      # ALT-38e — BELGE HIZLI YOLU (cetvel: docs/standards/test-karnesi-standard.md §4.3). Sınıf `belge` (tabandan çıkan sınıflayıcı) VE değişen her dosya `.md`, `.txt` ya da `.csv` ise
      # aşağıdaki kod kapıları (kurulum: yalnız pnpm önbelleği isabet ettiyse, aşağıda `Install dependencies`; Lint, tip, Deno ve edge kapıları, V8 önbelleği) ATLANIR: bu dosyalar Lint, tsc ve deno check'in girdisi değildir. `belge` sınıfı tek başına YETMEZ:
      # `.claude/`, `docs/` ve `.agent/` altındaki `.cjs`/`.mjs` dosyaları da `belge`dir ama `eslint .` onları tarar (ölçüldü: `.claude/hooks/*.cjs` ignore edilmiyor), `.ts`/`.tsx` tsc'nin girdisidir
      # ve JSON'u bir test içe aktarırsa tip denetimi değişir. Bu yüzden uzantı dar tutulur ve git'in kendi yol süzgeciyle (`:(exclude,glob)`) sınanır: dışarıda KALAN tek bir fark varsa
      # (kod, JSON, silinen ya da taşınan dosya, hata) çıktı YAZILMAZ ve her kapı koşar. Yalnız `pull_request` olayında ve `edited` DIŞINDA koşar (`edited` koşusunda `ci` içindeki Test
      # kuruluma ihtiyaç duyar); koşul `test-shard` işinin olayıyla birebir aynıdır. Çıktı yoksa ya da başka değerse HER ŞEY koşar (koşullar yalnız DARALTMA yönünde).
      # `edited ayna kararı`ndan bağımsızdır (HEP KOŞAN, INV-CI-EDITED-1). PR kayıt kapısı, Secret guard, Döküm kapısı (`.csv` dökümü bu yola GİRER), taban izi ve sınıf adımı bu yolda DA koşar.
      - name: Hızlı yol (yalnız .md/.txt/.csv belgesi; kod kapıları atlanır)
        id: hizli
        if: github.event_name == 'pull_request' && github.event.action != 'edited' && steps.sinif.outputs.sinif == 'belge'
        run: |
          if ! git diff --quiet --no-renames HEAD^1 HEAD && git diff --quiet --no-renames HEAD^1 HEAD -- . ':(exclude,glob)**/*.md' ':(exclude,glob)**/*.txt' ':(exclude,glob)**/*.csv'; then
            echo "::notice::hızlı yol: belge — değişen her dosya .md/.txt/.csv; Lint, tip ve Deno kapıları atlanır"
            echo "belge=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::hızlı yol: yok — sınıf belge ama .md/.txt/.csv dışında bir fark var; tüm kapılar koşar"
          fi

      - name: Setup Deno
        if: steps.ayna.outputs.atla != 'true' && steps.hizli.outputs.belge != 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # ALT-39 (INV-DEPO-DOKUM-1): veritabanı dökümü, kişisel veri, ödeme parçası ve fiyat-maliyet listesi master'a birleşmesin.
      # Bağımlılıksız (git + node, saniyeler) olduğu için Install'dan ÖNCE; `if:` YOK. ⚠"Her koşuda" DEĞİL: önceki bir adım
      # kırmızıysa bu adım da koşmaz (Actions varsayılanı). PR'da tam geçmiş varsa ara commit'leri de tarar. ⚠Ağa çıkışı bu adım
      # DURDURAMAZ: onu yalnız `.githooks/pre-push` yakalar (`--no-verify` ile atlanabilir). Cetvel: docs/standards/depoya-giremeyecek-veri-standard.md
      - name: Döküm kapısı (depoya giremeyecek veri)
        run: node scripts/security/depo-dokum-kapisi.cjs

      # Hızlı yolda (belge) kurulum YALNIZ pnpm deposu önbelleği isabet ettiyse atlanır: ıskada `setup-node`'un önbellek KAYIT adımı (iş sonunda) var olmayan depoyu kaydetmeye çalışıp `Path Validation Error`
      # ile işi kırmızı yapar (v7.0.0 kaynağı: hata yakalanmaz) ve boş depoyu kaydetmek önbelleği zehirlerdi; ıskada kurulum koşar ki kaydedilen önbellek gerçek olsun. Çıktı yoksa da KOŞAR.
      - name: Install dependencies
        if: steps.ayna.outputs.atla != 'true' && (steps.hizli.outputs.belge != 'true' || steps.node.outputs.cache-hit != 'true')
        run: pnpm install --prefer-offline --config.allow-scripts true

      - name: Lint (blocking)
        if: steps.ayna.outputs.atla != 'true' && steps.hizli.outputs.belge != 'true'
        run: pnpm run lint 2>&1 | tee ci-lint.log

      - name: Type check
        if: steps.ayna.outputs.atla != 'true' && steps.hizli.outputs.belge != 'true'
        run: pnpm exec tsc --noEmit 2>&1 | tee ci-typecheck.log

      # Edge Functions (Deno) Next.js tsc kapsamı DIŞINDA — tsconfig supabase/'i hariç tutar.
      # Bu adım 2026-05'te maskesiz kalan edge bozulmasını (T011) yakalamak için eklendi: kalıcı kapı.
      - name: Deno check (edge functions — kapı-körlüğü guard)
        if: steps.ayna.outputs.atla != 'true' && steps.hizli.outputs.belge != 'true'
        # --node-modules-dir=none ŞART: `auto` node_modules/.deno/ yaratıp pnpm ağacını kirletiyor
        # (undici@8.10.0 oradan çözülüp jsdom'u kırıyordu → adversarial.test.ts çöküyordu).
        # Bu regresyon #494'te girdi ama CI o zaman pipefail'siz olduğu için görünmedi.
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts 2>&1 | tee ci-deno.log

      # deno check TİP hatalarını yakalar ama saf string-literal mangling'i (PostgREST/RPC param,
      # searchParams key, mangled method çağrısı) GÖREMEZ — T011'de bu sınıf iki kez kaçtı.
      # Bu guard bozulma imzasını doğrudan tarar (unambiguous underscore-prefix desenleri).
      - name: Edge mangle-guard (string-literal — deno check göremez)
        if: steps.ayna.outputs.atla != 'true' && steps.hizli.outputs.belge != 'true'
        run: |
          # NOT: son iki sınıf sonradan eklendi — `_data:`/`_text:` gibi mangled OBJE ANAHTARLARI
          # ilk guard'ın kör noktasıydı ve checkout'u kırık bıraktı (frontend `data.data` bekliyordu).
          # `_productId` bilinçli/tutarlı bir isimlendirme (gönderen+alan aynı) → allowlist.
          hits=$(grep -rnE '\._[a-z]+\(|_text/(html|plain)|[?&]_(limit|count|offset|order|select)=|\.get\('"'"'_[a-z]|\b_p_id\b|grou_p|([{,]|^)\s*_[a-z][a-zA-Z_]*:' supabase/functions --include='*.ts' | grep -vE '_productId' | grep -vE ':[0-9]+:\s*(export )?(async )?function ' || true)
          if [ -n "$hits" ]; then echo "::error::Edge string-mangle deseni saptandi (T011 bozulma sinifi):"; echo "$hits"; exit 1; fi
          # Ayni sinif src/ tarafinda da yasandi: ReturnsTableBody `_return_id` gonderiyordu,
          # edge fonksiyonu `return_id` bekliyordu -> her iade bildirimi 400 donuyor ve hata
          # yutuluyordu. Kapsam bilerek DAR: sadece functions.invoke govdeleri (src genelinde
          # `_anahtar:` taramasi 22 mesru `_productId` eslesmesi uretiyor = gurultu).
          inv=$(grep -rn -A12 "functions\.invoke(" src --include='*.ts' --include='*.tsx' | grep -E '^\S+[-:][0-9]+[-:]\s*_[a-z][a-zA-Z_]*:' || true)
          if [ -n "$inv" ]; then echo "::error::functions.invoke govdesinde mangled anahtar:"; echo "$inv"; exit 1; fi
          # BILINEN SINIR: destructuring sinifi (`const { ..., _data } = body`) grep ile
          # mesru "kullanilmayan degisken" deyiminden ayirt EDILEMEZ; bu guard onu gormez.
          # notification-service'te tam bu sinif aylarca sessizce stok uyarilarini oldurdu.

      # T018: codemod'un ÜÇÜNCÜ zarar sınıfı — mangling DEĞİL, SESSİZ SİLME.
      # "Kullanılmayan değişken" temizliği 9 fonksiyonda `getCorsHeaders` import'unu bırakıp
      # onu çağıran kodu sildi, yerine `Access-Control-Allow-Origin`'i OLMAYAN elle yazılmış
      # bir cors objesi koydu. Tarayıcıdan çağrılan fonksiyonlar (admin kargo/iade ekranları)
      # bu haliyle deploy edilse tamamen kırılırdı. deno check göremez (tip hatası değil),
      # mangle-guard göremez (underscore deseni değil) → ayrı kapı ŞART.
      - name: Edge CORS guard (ölü getCorsHeaders importu + eksik Allow-Origin)
        if: steps.ayna.outputs.atla != 'true' && steps.hizli.outputs.belge != 'true'
        run: |
          hits=""
          for f in supabase/functions/*/index.ts; do
            [ -f "$f" ] || continue
            if grep -q 'import { getCorsHeaders }' "$f" && ! grep -q 'getCorsHeaders(' "$f"; then
              hits="${hits}${f}: getCorsHeaders import edilmis ama HIC CAGRILMAMIS"$'\n'
            fi
            # Elle yazilmis CORS objesi (Allow-Headers var) ama ne Allow-Origin ne de helper var.
            if grep -q "'Access-Control-Allow-Headers'" "$f" \
               && ! grep -q 'Access-Control-Allow-Origin' "$f" \
               && ! grep -q 'getCorsHeaders(' "$f"; then
              hits="${hits}${f}: elle CORS objesi var, Access-Control-Allow-Origin YOK"$'\n'
            fi
          done
          if [ -n "$hits" ]; then echo "::error::Edge CORS bozulmasi (T018 sinifi):"; printf '%s' "$hits"; exit 1; fi

      # Sabit-kodlu DB bağlantı dizesi (şifreli) tekrar commit'lenmesin — kredensiyeller env'den.
      # İnterpolasyonlu (`${...}`) satırlar hariç tutulur (onlar değişkenden kurulur, sır değil).
      - name: Secret guard (hardcoded DB connection string)
        if: steps.ayna.outputs.atla != 'true'
        run: |
          hits=$(grep -rnE "postgresql://[^'\"]*:[^'\"@]*@" --include='*.ts' --include='*.js' --include='*.cjs' --include='*.mjs' . | grep -v node_modules | grep -v '\${' || true)
          if [ -n "$hits" ]; then echo "::error::Hardcoded DB connection string (with password) detected — use process.env.DATABASE_URL:"; echo "$hits"; exit 1; fi

      # ALT-38c — Node V8 bayt kodu önbelleği (resmi öneri: vitest.dev/guide/improving-performance; Node >= 22.1, burada 24). YALNIZ hız içindir:
      # önbellek girdileri kaynak içeriğinin özetiyle doğrulanır, bayat ya da bozuk girdi yok sayılır (sonuç değişmez). Ortam değişkeni yalnız
      # Test adımına verilir; dizin runner geçici alanındadır (çalışma ağacına dosya düşmez: depo tarayan testler görmez).
      - name: Node derleme önbelleği (V8 bayt kodu)
        if: steps.ayna.outputs.atla != 'true' && steps.hizli.outputs.belge != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/node-compile-cache
          key: node-compile-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-compile-${{ runner.os }}-node24-

      # ALT-38 (karar: dünya durumu testleri PR'ı bloklamaz): pull_request olayında scripts/ci/dunya-durumu-testleri.json
      # listesindeki testler DIŞARIDA koşar (kip `dislan`); master push, elle koşum ve yerel `pnpm test` TAM paketi koşar,
      # ayrıca dunya-durumu.yml zamanlı olarak yalnız onları koşar (kip `yalniz`). Çıkan her test silinmez: neden, kanıt ve
      # yeni yeri listede yazılıdır ve INV-TEST-KOSU-1 bu bağın kopmadığını doğrular (cetvel:
      # docs/standards/test-karnesi-standard.md §3). Neden: bir PR'ın kodundan bağımsız kırmızı
      # (INV-TABAN-TAZE-1: son 10 kırmızının 5'i) suçsuz PR'ı bekletiyor ve yazar düzeltemiyor.
      # ALT-38c-2: pull_request'te (edited HARİÇ) Test bu işte KOŞMAZ; aşağıdaki `test-shard` işlerinde N paralel koşar ve bu işin SON adımı ("Test shard
      # sonuçları") hepsinin başarıyla bitmesini bekler (kırmızı shard = kırmızı `ci`). master push, elle koşum ve `edited` koşusunda Test eskisi gibi burada
      # TAM koşar. Koşul yalnız DARALTMA yönünde değildir: bu adım atlanınca test paketinin geri kalanını `test-shard` işleri üstlenir (INV-CI-SHARD-1/2).
      - name: Test
        if: steps.ayna.outputs.atla != 'true' && !(github.event_name == 'pull_request' && github.event.action != 'edited')
        env:
          VENTHUB_DUNYA_DURUMU: ${{ github.event_name == 'pull_request' && 'dislan' || '' }}
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm test -- --run --reporter=dot 2>&1 | tee ci-test.log

      # ALT-38c — Next.js derleme önbelleği (resmi öneri: nextjs.org/docs/app/guides/ci-build-caching). Yalnız Build'in koşacağı koşuda geri yüklenir
      # (koşul Build ile BİREBİR aynı). Anahtar: işletim sistemi + kilit dosyası + kaynak özeti; kaynak değişince son kayıt önekle geri yüklenir
      # (restore-keys) ve derleme yalnız değişen modülleri yeniden derler. YALNIZ hız içindir: Next önbellek girdilerini içerik özetiyle doğrular.
      - name: Next.js derleme önbelleği
        if: steps.ayna.outputs.atla != 'true' && !contains(fromJSON('["belge","edge","betik","karma"]'), steps.sinif.outputs.sinif)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'next.config.mjs') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # ALT-38c — koşul YALNIZ daraltma yönünde: dar sınıf (belge, edge, betik, karma) AÇIKÇA yazılmışsa atlanır; çıktı boş, `tam`, bilinmeyen
      # ya da adım hiç koşmamışsa (push, elle koşum, hata) Build KOŞAR. Küme, sınıflayıcının dar sınıflarıyla birebirdir (INV-CI-SINIF-1).
      - name: Build (blocking)
        if: steps.ayna.outputs.atla != 'true' && !contains(fromJSON('["belge","edge","betik","karma"]'), steps.sinif.outputs.sinif)
        run: pnpm run build:ci 2>&1 | tee ci-build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key


      # ALT-38c-2 — TEST SHARD SONUÇLARI (mantık ve test: scripts/ci/test-shard-bekle.cjs). pull_request'te (edited hariç) Test aşağıdaki `test-shard` işlerinde koşar;
      # bu adım AYNI koşunun AYNI denemesindeki shard işlerinin HEPSİNİN `success` olmasını bekler (Lint ve Build ile üst üste ilerlediği için son adımdır).
      # Kırmızı/iptal/atlanan/eksik shard, zaman aşımı ve okunamayan API KIRMIZIDIR. `ci` adı ve adımları değişmez. SHARD_TOPLAM matrix ile BİREBİR aynı olmalı.
      - name: Test shard sonuçları (bekle ve doğrula)
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPO: ${{ github.repository }}
          KOSU_ID: ${{ github.run_id }}
          KOSU_DENEME: ${{ github.run_attempt }}
          SHARD_TOPLAM: '4'
        run: node scripts/ci/test-shard-bekle.cjs

  # ALT-38c-2 — TEST SHARD'LARI (cetvel: docs/standards/test-karnesi-standard.md §4.2). Yalnız pull_request'te ve `edited` DEĞİLKEN koşar. Zorunlu kontrol bu iş
  # DEĞİL `ci`dir; kırmızı bir shard `ci`yi kırmızı yapar. Dosyalar süreye göre dengeli dağıtılır (scripts/ci/test-shard.cjs); her test dosyası TAM BİR shard'a girer.
  # Kurulum `ci` ile aynıdır (tam geçmiş: INV-DOC-2 `git log` okur; Deno: bazı testler `deno` çağırır). Matrix sayısı `ci`nin SHARD_TOPLAM'ı ve `--toplam` ile aynı olmalı.
  #
  # ALT-38e — TEST SEÇİMİ (cetvel: §4.3; mantık: scripts/ci/test-sec.cjs, dağıtıcı girdisi: scripts/ci/test-shard.cjs `--secim`). Seçim YALNIZ BU İŞTE vardır: bu iş yalnız `pull_request`te (edited HARİÇ)
  # koşar; master push, elle koşum, `edited` ve zamanlı koşuda seçici HİÇ çalışmaz ve tam paket koşar (`ci` içindeki Test). Seçici, haritası ve sınıflayıcısı PR'ın kendi kopyasından DEĞİL TABANDAN (`git show HEAD^1:`)
  # çıkarılıp koşar (PR'ın seçici kopyası koşmaz); taban kopyası yoksa, seçici çökerse ya da çıktısı okunamazsa TAM. İki geçiş: (1) KURULUMDAN ÖNCE `--vitestsiz` (vitest açılmaz): seçim
  # kendiliğinden BOŞSA (`tam=false` ve `secilen-sayisi=0`) kurulum, seçim, dağıtım ve Test atlanır, iş saniyeler içinde YEŞİL biter; (2) kurulumdan sonra vitest'li geçiş nihai seçimi verir. Koşullar yalnız
  # DARALTMA yönündedir: çıktı eksik, boş ya da başka bir değerse kurulum ve test KOŞAR. Kırmızı bir seçici testi atlatamaz: her tutarsızlık dağıtıcıda TAM paket olur.
  test-shard:
    name: test-shard (${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # ALT-38e — SEÇİM 1/2 (KURULUMSUZ): taban kopyası `$RUNNER_TEMP/secici/` altına çıkar (seçici + harita + SINIFLAYICI: seçici sınıflayıcıyı önce kendi yanından, yoksa checkout'tan yükler; yanında olmazsa PR'ın
      # kendi sınıflayıcısı kurulumdan ÖNCE seçici sürecinde koşar ve `bos` kararını yazabilir), `--vitestsiz` ile vitest AÇILMAZ. Yalnız içe aktarılamaz dosyalar (md, csv, sql...) değiştiyse
      # kendisi cevap verir; içe aktarılabilir bir dosya (ts, tsx, js, json...) değiştiyse `tam=true` yazar ve ikinci geçiş (aşağıda, kurulumdan sonra) karar verir. Ad ve gövde INV-CI-SECIM-1 ile TAM sabit.
      - name: Test seçimi (tabandan, kurulumsuz)
        id: sec
        run: |
          d="$RUNNER_TEMP/secici"
          mkdir -p "$d"
          if ! git show HEAD^1:scripts/ci/test-sec.cjs > "$d/test-sec.cjs" 2>/dev/null || ! git show HEAD^1:scripts/ci/test-haritasi.json > "$d/test-haritasi.json" 2>/dev/null || ! git show HEAD^1:scripts/ci/degisiklik-sinifi.cjs > "$d/degisiklik-sinifi.cjs" 2>/dev/null; then
            echo "::notice::test seçimi: tam — taban kopyası yok (HEAD^1:scripts/ci/test-sec.cjs, test-haritasi.json, degisiklik-sinifi.cjs)"
            printf 'tam=true\nneden=taban kopyası yok\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cikis=0
          node "$d/test-sec.cjs" --kok "$GITHUB_WORKSPACE" --harita "$d/test-haritasi.json" --vitestsiz --cikti "$RUNNER_TEMP/secilen.txt" || cikis=$?
          if [ "$cikis" -ne 0 ]; then
            echo "::warning::test seçimi: tam — seçici çöktü (çıkış kodu $cikis), tam paket koşar"
            printf 'tam=true\nneden=seçici çöktü, çıkış kodu %s\n' "$cikis" >> "$GITHUB_OUTPUT"
          fi
          tam=$(sed -n 's/^tam=//p' "$GITHUB_OUTPUT" | tail -n 1)
          sayi=$(sed -n 's/^secilen-sayisi=//p' "$GITHUB_OUTPUT" | tail -n 1)
          bos=false
          if [ "$tam" = "false" ] && [ "$sayi" = "0" ]; then bos=true; fi
          echo "bos=$bos" >> "$GITHUB_OUTPUT"

      # Kurulum ve Test YALNIZ seçim kendiliğinden BOŞ DEĞİLSE koşar: adım SON satırında `bos=true` ya da `bos=false` yazar; `true` YALNIZ seçicinin SON `tam=false` VE `secilen-sayisi=0` yazdığı durumdadır
      # (çökme yedeği `tam=true`yu ezer; seçicinin kendi yazdığı bir `bos` de bu son satırla ezilir). Koşullar `bos` çıktısını `!= 'true'` ile okur: çıktı yoksa ya da başka değerse KOŞAR.
      # Seçicinin ham çıktısı koşulda KULLANILMAZ: GitHub eşitsiz türleri sayıya çevirir ve eksik çıktı (null) ile `'0'` ikisi de 0 olur, yani `secilen-sayisi != '0'` eksik çıktıda "atla" derdi
      # (doküman: "Null → 0", sayısal dize → sayı). `'true'` sayıya çevrilemez (NaN): bu karşılaştırmada yalnız TAM `true` atlatır.
      - name: Setup Deno
        if: steps.sec.outputs.bos != 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Lifecycle betikleri KAPALI (`--ignore-scripts`): kökün `postinstall`ı `tsc --noEmit` koşturur (~20 sn, her shard'da) ve testler onu kullanmaz; tip denetimi `ci` işindedir (orada DEĞİŞMEZ).
      - name: Install dependencies
        if: steps.sec.outputs.bos != 'true'
        run: pnpm install --prefer-offline --config.allow-scripts true --ignore-scripts

      # `ci` ile AYNI anahtar: master push'ta kaydedilen önbellek PR'ın ilk koşusunda bile sıcak gelir (yalnız hız; sonuç değişmez).
      - name: Node derleme önbelleği (V8 bayt kodu)
        if: steps.sec.outputs.bos != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/node-compile-cache
          key: node-compile-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-compile-${{ runner.os }}-node24-

      # ALT-38e — SEÇİM 2/2 (VİTEST'Lİ): aynı taban kopyası, bayraksız; vitest'in KENDİ test listesi ve `related` grafiğiyle nihai seçimi verir (dağıtıcı yalnız bu geçişin çıktısını okur). `dislan` kipi
      # shard'ın göreceği kümeyle aynı olsun diye verilir; bu adım test KOŞTURMAZ (ortamı alt süreçlere sızmaz).
      - name: Test seçimi (tabandan, vitest ile)
        id: secv
        if: steps.sec.outputs.bos != 'true'
        env:
          VENTHUB_DUNYA_DURUMU: dislan
        run: |
          d="$RUNNER_TEMP/secici"
          if [ ! -s "$d/test-sec.cjs" ] || [ ! -s "$d/test-haritasi.json" ] || [ ! -s "$d/degisiklik-sinifi.cjs" ]; then
            echo "::notice::test seçimi: tam — taban kopyası yok"
            printf 'tam=true\nneden=taban kopyası yok\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cikis=0
          node "$d/test-sec.cjs" --kok "$GITHUB_WORKSPACE" --harita "$d/test-haritasi.json" --cikti "$RUNNER_TEMP/secilen.txt" || cikis=$?
          if [ "$cikis" -ne 0 ]; then
            echo "::warning::test seçimi: tam — seçici çöktü (çıkış kodu $cikis), tam paket koşar"
            printf 'tam=true\nneden=seçici çöktü, çıkış kodu %s\n' "$cikis" >> "$GITHUB_OUTPUT"
          fi

      # Dağıtım: seçici çıktısı (`tam`, `secilen-sayisi`, liste dosyası) dağıtıcıya ARGÜMAN olarak verilir ve orada doğrulanır (tutarsızsa TAM paket). Parçaya hiç test düşmediyse (seçim modunda meşru) `kos=false`
      # yazar. KARMA KİP: dört iş seçimi BAĞIMSIZ hesaplar; biri tam'a düşerse (seçici çöktü) bölmeler ayrışıp seçilen testler hiçbir işte koşmasın diye bölme HER ZAMAN `vitest list`in tam listesindedir,
      # seçim yalnız kendi parçayı süzer (birleşim ⊇ seçim). SECIM_* değişkenleri yalnız bu adımdadır: testlerin koştuğu adımın ortamına GİRMEZ (alt süreçlere sızmaz; canlı ders: #1741 koşu 2).
      - name: Test dağıtımı (shard ${{ matrix.shard }}/4)
        id: dagit
        if: steps.sec.outputs.bos != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          VENTHUB_DUNYA_DURUMU: dislan
          SECIM_TAM: ${{ steps.secv.outputs.tam }}
          SECIM_SAYI: ${{ steps.secv.outputs.secilen-sayisi }}
        run: node scripts/ci/test-shard.cjs --shard "$SHARD" --toplam 4 --cikti "$RUNNER_TEMP/shard.json" --secim "$RUNNER_TEMP/secilen.txt" --secim-tam "$SECIM_TAM" --secim-sayi "$SECIM_SAYI"

      # Test: bu parçaya test düştüyse koşar. `kos` yalnız `false` ise atlanır; çıktı yoksa ya da başka değerse KOŞAR (kapı sessizce düşmez). Kabuk bash (pipefail): `| tee` kırmızıyı yutmaz.
      - name: Test (shard ${{ matrix.shard }}/4)
        if: steps.sec.outputs.bos != 'true' && steps.dagit.outputs.kos != 'false'
        env:
          VENTHUB_DUNYA_DURUMU: dislan
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: VENTHUB_TEST_SHARD_DOSYALARI="$RUNNER_TEMP/shard.json" pnpm test -- --run --reporter=dot 2>&1 | tee ci-test.log
