name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (allow scripts for native deps)
        run: pnpm install --prefer-offline --config.allow-scripts true

      - name: Lint (blocking)
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc -b tsconfig.build.json

      - name: Test
        run: pnpm test -- --run --reporter=dot

      - name: Build (blocking)
        run: pnpm run build:ci 2>&1 | tee build-error.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key

      - name: 🔐 Safe Secret Diagnostics
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "❌ HATA: GEMINI_API_KEY tamamen boş!"
            exit 1
          else
            SECRET_VALUE="${{ secrets.GEMINI_API_KEY }}"
            echo "✅ Şifre bulundu."
            echo "📏 Uzunluk: ${#SECRET_VALUE} karakter."
            echo "🔍 İlk 4 karakter: ${SECRET_VALUE:0:4}..."
          fi

      - name: 🤖 AI Auto-Repair on Failure
        if: failure()
        uses: google-github-actions/run-gemini-cli@v0
        # Şifreyi hem INPUT hem de ENV olarak veriyoruz, hiçbir kaçışı kalmıyor.
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: |
            CI Build fail oldu!
            Dosya: `src/components/SearchOverlay.tsx`
            Hata: `NON_EXISTENT_AI_VARIABLE_ERROR` değişkeni yüzünden build patlıyor.
            
            GÖREV:
            1. `src/components/SearchOverlay.tsx` dosyasını aç.
            2. O bozuk satırı bul ve SİL.
            3. Değişikliği "🤖 AI: Self-healed build failure" mesajıyla commit et ve pushla.
