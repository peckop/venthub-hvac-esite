name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # KRİTİK: GitHub Actions'ın örtük varsayılanı `bash -e` — pipefail YOK.
    # Adımlar `... 2>&1 | tee X.log` şeklinde olduğu için exit kodu tee'den geliyordu
    # (her zaman 0) → Lint/Type check/Test/Build/Deno check adımlarının HİÇBİRİ
    # bloklamıyordu. Açık `shell: bash` pipefail'i devreye alır ve kapıları gerçek yapar.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --prefer-offline --config.allow-scripts true

      - name: Lint (blocking)
        run: pnpm run lint 2>&1 | tee ci-lint.log

      - name: Type check
        run: pnpm exec tsc --noEmit 2>&1 | tee ci-typecheck.log

      # Edge Functions (Deno) Next.js tsc kapsamı DIŞINDA — tsconfig supabase/'i hariç tutar.
      # Bu adım 2026-05'te maskesiz kalan edge bozulmasını (T011) yakalamak için eklendi: kalıcı kapı.
      - name: Deno check (edge functions — kapı-körlüğü guard)
        # --node-modules-dir=none ŞART: `auto` node_modules/.deno/ yaratıp pnpm ağacını kirletiyor
        # (undici@8.10.0 oradan çözülüp jsdom'u kırıyordu → adversarial.test.ts çöküyordu).
        # Bu regresyon #494'te girdi ama CI o zaman pipefail'siz olduğu için görünmedi.
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts 2>&1 | tee ci-deno.log

      # deno check TİP hatalarını yakalar ama saf string-literal mangling'i (PostgREST/RPC param,
      # searchParams key, mangled method çağrısı) GÖREMEZ — T011'de bu sınıf iki kez kaçtı.
      # Bu guard bozulma imzasını doğrudan tarar (unambiguous underscore-prefix desenleri).
      - name: Edge mangle-guard (string-literal — deno check göremez)
        run: |
          # NOT: son iki sınıf sonradan eklendi — `_data:`/`_text:` gibi mangled OBJE ANAHTARLARI
          # ilk guard'ın kör noktasıydı ve checkout'u kırık bıraktı (frontend `data.data` bekliyordu).
          # `_productId` bilinçli/tutarlı bir isimlendirme (gönderen+alan aynı) → allowlist.
          hits=$(grep -rnE '\._[a-z]+\(|_text/(html|plain)|[?&]_(limit|count|offset|order|select)=|\.get\('"'"'_[a-z]|\b_p_id\b|grou_p|([{,]|^)\s*_[a-z][a-zA-Z_]*:' supabase/functions --include='*.ts' | grep -vE '_productId' | grep -vE ':[0-9]+:\s*(export )?(async )?function ' || true)
          if [ -n "$hits" ]; then echo "::error::Edge string-mangle deseni saptandi (T011 bozulma sinifi):"; echo "$hits"; exit 1; fi
          # Ayni sinif src/ tarafinda da yasandi: ReturnsTableBody `_return_id` gonderiyordu,
          # edge fonksiyonu `return_id` bekliyordu -> her iade bildirimi 400 donuyor ve hata
          # yutuluyordu. Kapsam bilerek DAR: sadece functions.invoke govdeleri (src genelinde
          # `_anahtar:` taramasi 22 mesru `_productId` eslesmesi uretiyor = gurultu).
          inv=$(grep -rn -A12 "functions\.invoke(" src --include='*.ts' --include='*.tsx' | grep -E '^\S+[-:][0-9]+[-:]\s*_[a-z][a-zA-Z_]*:' || true)
          if [ -n "$inv" ]; then echo "::error::functions.invoke govdesinde mangled anahtar:"; echo "$inv"; exit 1; fi
          # BILINEN SINIR: destructuring sinifi (`const { ..., _data } = body`) grep ile
          # mesru "kullanilmayan degisken" deyiminden ayirt EDILEMEZ; bu guard onu gormez.
          # notification-service'te tam bu sinif aylarca sessizce stok uyarilarini oldurdu.

      # T018: codemod'un ÜÇÜNCÜ zarar sınıfı — mangling DEĞİL, SESSİZ SİLME.
      # "Kullanılmayan değişken" temizliği 9 fonksiyonda `getCorsHeaders` import'unu bırakıp
      # onu çağıran kodu sildi, yerine `Access-Control-Allow-Origin`'i OLMAYAN elle yazılmış
      # bir cors objesi koydu. Tarayıcıdan çağrılan fonksiyonlar (admin kargo/iade ekranları)
      # bu haliyle deploy edilse tamamen kırılırdı. deno check göremez (tip hatası değil),
      # mangle-guard göremez (underscore deseni değil) → ayrı kapı ŞART.
      - name: Edge CORS guard (ölü getCorsHeaders importu + eksik Allow-Origin)
        run: |
          hits=""
          for f in supabase/functions/*/index.ts; do
            [ -f "$f" ] || continue
            if grep -q 'import { getCorsHeaders }' "$f" && ! grep -q 'getCorsHeaders(' "$f"; then
              hits="${hits}${f}: getCorsHeaders import edilmis ama HIC CAGRILMAMIS"$'\n'
            fi
            # Elle yazilmis CORS objesi (Allow-Headers var) ama ne Allow-Origin ne de helper var.
            if grep -q "'Access-Control-Allow-Headers'" "$f" \
               && ! grep -q 'Access-Control-Allow-Origin' "$f" \
               && ! grep -q 'getCorsHeaders(' "$f"; then
              hits="${hits}${f}: elle CORS objesi var, Access-Control-Allow-Origin YOK"$'\n'
            fi
          done
          if [ -n "$hits" ]; then echo "::error::Edge CORS bozulmasi (T018 sinifi):"; printf '%s' "$hits"; exit 1; fi

      # Sabit-kodlu DB bağlantı dizesi (şifreli) tekrar commit'lenmesin — kredensiyeller env'den.
      # İnterpolasyonlu (`${...}`) satırlar hariç tutulur (onlar değişkenden kurulur, sır değil).
      - name: Secret guard (hardcoded DB connection string)
        run: |
          hits=$(grep -rnE "postgresql://[^'\"]*:[^'\"@]*@" --include='*.ts' --include='*.js' --include='*.cjs' --include='*.mjs' . | grep -v node_modules | grep -v '\${' || true)
          if [ -n "$hits" ]; then echo "::error::Hardcoded DB connection string (with password) detected — use process.env.DATABASE_URL:"; echo "$hits"; exit 1; fi

      - name: Test
        run: pnpm test -- --run --reporter=dot 2>&1 | tee ci-test.log

      - name: Build (blocking)
        run: pnpm run build:ci 2>&1 | tee ci-build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key

      # Hata durumunda TÜM adımların logları yüklenir
      # ai-auto-repair.yml bu artefaktı okuyarak Jules'a iletir
      - name: Upload CI Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            ci-lint.log
            ci-typecheck.log
            ci-deno.log
            ci-test.log
            ci-build.log
          retention-days: 3
