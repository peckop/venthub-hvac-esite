name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENTS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --prefer-offline

      - name: Build (blocking)
        run: |
          set -o pipefail
          pnpm run build:ci 2>&1 | tee build-error.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key

      - name: 🤖 AI Auto-Repair on Failure
        if: failure()
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          github_token: ${{ secrets.AGENTS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENTS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PROMPT: |
            CI Build fail oldu!
            Log: $(cat build-error.log | tail -n 20)
            Düzelt ve pushla.
