# ══════════════════════════════════════════════════════════════════════════════
# KARAR 52 (Recep, 2026-09-19, ilk elden: "ops ile konuştuğum konu için bana soracağın
# onaya evet diyorum") — sürüm takibi GitHub'ın yerleşik mekanizmasına devredildi.
#
# NİÇİN: Recep — "sürüm takibini canlı tutmamak ihmal, çözmezsek tekrar eder." Ölçüldü
# 2026-09-19: 77 bağımlılığın 63'ünün yeni sürümü, 28'inin ana sürüm atlaması var; ve bunu
# söyleyen tek şey elle koşulan bir tarama betiğiydi.
#
# BOT PR'I VERCEL'DE DERLEME HARCAMAZ (ölçüldü 2026-09-21): `scripts/vercel-ignore-build.sh`
# `master` dışındaki HER dalı atlıyor; bot dalları `dependabot/...`. Actions ise depo public
# olduğu için ücretsiz.
#
# ⛔BOT PR'I KENDİLİĞİNDEN BİRLEŞMEZ: her PR merge ritüelinden geçer (INV-DEP-KARAR-1 dahil —
# bot bir SABİT PİNİ ya da override'ı değiştirirse kayıt güncellenmeden kırmızı kalır;
# bu kasıtlı: bot sürümü değiştirir, gerekçeyi insan yazar).
#
# Cetvel: docs/standards/bagimlilik-guvenlik-yukseltme-standard.md §11.
# ══════════════════════════════════════════════════════════════════════════════
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    # Tavan DÜŞÜK başlar (OPS 09-19: 3-5). 63 eskiyen paket bir haftada PR selidir; önce
    # akışın taşınabildiği ölçülür, sonra tavan yükseltilir.
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    # Grup SIRASI önemli: bir paket eşleştiği İLK gruba girer.
    groups:
      # GÜVENLİK güncellemeleri tek PR — acil olanlar sürüm gürültüsünde kaybolmasın.
      guvenlik:
        applies-to: security-updates
        patterns: ['*']
      # React + Next BİRLİKTE hareket eder ve GÖRSEL doğrulama ister (URUN şeridi).
      # Tam pinli dörtlü burada: §2.1 "gevşetme adayı" — bot PR'ı gevşetme DENEMESİ değildir,
      # ama o denemenin başlangıç noktası olur.
      react-next:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'next'
          - 'eslint-config-next'
          - '@next/*'
      # 3D — carousel ve ürün görüntüleyici; görsel doğrulama ister (URUN).
      uc-boyut:
        patterns:
          - 'three'
          - '@types/three'
          - '@react-three/*'
      # Ana sürüm OLMAYAN her şey tek PR. Ana sürümler bu gruba girmez → ayrı ayrı PR.
      # ALT-220 (23 Kasım): @sentry/nextjs ve axe-core gruptan ÇIKARILDI, kendi PR'larını açar.
      # Sebep (2662, ölçüldü): grup içindeyken 11.12→11.15 tünel yeniden yazımını (rota-dili-acik-kip
      # testi) ve 4.14.0→4.14.1 axe "karar verilemedi" sayısını (22 > taban 21) oynattı; tek PR'da
      # 12 zararsız paketi kırmızı tutuyordu. Ayrı PR gelince paket bazında ölçülür.
      # KALDIRMA ŞARTI: Sentry tünel testi ve axe tabanı yeni sürümle yeşile döndüğü gün çıkarma silinir.
      kucuk-ve-yama:
        update-types: [minor, patch]
        exclude-patterns:
          - '@sentry/nextjs'
          - 'axe-core'
    ignore:
      # ALT-220 (23 Kasım): @types/node majoru ÇALIŞMA ZAMANINDA kalır. engines node 24.x, CI node 24;
      # 26 tipi 24'te olmayan API'yi derletir (#2663). KALDIRMA ŞARTI: runtime Node 26'ya çıktığı gün.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      # ALT-220 (23 Kasım): @vitejs/plugin-react major'ı Vite geçişine kadar yok sayılır. 5.x kurulumda
      # postinstall tip denetimini kırdı (vitest.config.ts TS2307, #2664); kazancı yok (vite 6).
      # KALDIRMA ŞARTI: vite 7/8 geçişi başladığı gün.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # ALT-220 (23 Kasım, karar 412): `supabase` (CLI) major'ı yok sayılır. CI iş akışları CLI'ı setup-cli ile
      # 2.101.0'a sabitler; bu devDependency'yi çalıştıran yer yok. v3 kırıcıları (--db-url/--project-ref yerine
      # --remote, varsayılan hedef yerel yığın) pin yükseltilince ayrı işte ele alınır (#2671 kapatıldı).
      # KALDIRMA ŞARTI: CLI v3 geçişi (pin + çağrılar + gölge ölçüm) başladığı gün.
      - dependency-name: 'supabase'
        update-types: ['version-update:semver-major']
      # ALT-220 (23 Kasım, karar 412): `framer-motion` major'ı yok sayılır. 11→14 üç ana sürüm, 32 dosyada
      # kullanım, animasyon farkını CI ölçmez; eski vitrin yeni siteye geçince silinecek (#2672 kapatıldı).
      # KALDIRMA ŞARTI: eski vitrin silindiği gün (paket de kalkar) ya da yeni sitede framer-motion kullanılırsa
      # o sitenin kendi sürüm kararıyla.
      - dependency-name: 'framer-motion'
        update-types: ['version-update:semver-major']
      # ALT-221 (23 Kasım, karar 412): `recharts` major'ı yok sayılır. 2→3 admin paneli tiplerini kırdı
      # (AbcPieChart.tsx Formatter tipi, ActivityHeatmap.tsx number[] ve readonly [number, number]; #2677
      # kapatıldı); panel kodu uyarlanmadan birleşmez, yeni site sıfırdan kurulacak.
      # KALDIRMA ŞARTI: admin paneli recharts 3 API'sine uyarlandığı gün.
      - dependency-name: 'recharts'
        update-types: ['version-update:semver-major']
      # ALT-221 (23 Kasım): `@sentry/nextjs` >=11.13.0 yok sayılır. 11.13.0 "Emit the tunnel route handler"
      # ile `tunnelRoute: "/monitoring"` yeniden yazımı kalkıyor görünür: rota-dili-acik-kip testi
      # ("Sentry tüneli: /monitoring için yeniden yazım VAR") 11.15'te de düştü (#2662, #2676; 4141 test geçti,
      # tek kırmızı). Tünel tarayıcı hata iletimini taşır; yeni davranış (route handler, CSP, reklam engelleyici
      # yolu) ölçülüp test uyarlanana kadar bekler. Kurulu sürüm 11.12.0. Yeni sürüm gerekirse bu satır elle
      # kaldırılır.
      # KALDIRMA ŞARTI: tünel route handler davranışı ölçüldü ve rota-dili-acik-kip testi ona göre uyarlandı.
      - dependency-name: '@sentry/nextjs'
        versions: ['>=11.13.0']
      # ALT-223 (23 Kasım, karar 412): KALAN AÇIK MAJOR ADAYLARI TOPLU YOK SAYILIR (npm registry'ye karşı 23 Kasım
      # ölçümü, 79 bağımlılıktan 20'si bir ana sürüm geride; 7'si yukarıda zaten yok sayılıyor). Sebep: eski vitrin
      # yeni siteye geçince silinecek, yeni site kendi sürümleriyle sıfırdan kurulacak; ana sürümler tek tek PR olarak
      # gelip her seferinde log okutuyor (#2662-#2681). Her satır tek bir ailenin kaydıdır.
      # KALDIRMA ŞARTI (hepsi için): ilgili paketin kullanıldığı eski vitrin kodu silindiği gün satır silinir; eski
      # vitrin kalırken bir ana sürüm GEREKİRSE (güvenlik, Node/Next uyumu) o satır elle kaldırılır, kayıt bu dosyada kalır.
      # Tailwind 4 ailesi (birlikte hareket eder: tailwind-merge 3 Tailwind 4 ister, eklenti 4 aynı yönde):
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwind-merge'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-tailwindcss'
        update-types: ['version-update:semver-major']
      # ESLint 10 ailesi (eslint-config-next 15 ve eklentilerle uyum ölçülmedi):
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Derleme ve test zinciri (birlikte hareket eder; Vite 8 + Vitest 5 + jsdom 31 ayrı geçiş işidir):
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/jest-dom'
        update-types: ['version-update:semver-major']
      # Tek paketler (davranış farkını CI ölçmez):
      - dependency-name: 'lucide-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'isomorphic-dompurify'
        update-types: ['version-update:semver-major']
      # ALT-223 (23 Kasım, karar 412): `axe-core` >=4.14.1 yok sayılır. 4.14.1 (#2680, #2662) admin-smoke'ta
      # color-contrast "karar verilemedi" düğüm sayısını tabanın (21) üstüne, 22'ye çıkarıyor; taban 21 KALIR, kapı
      # gevşemez. Yeni axe düğümünün gerçekte ne olduğu ölçülmeden yükseltilmez.
      # KALDIRMA ŞARTI: yeni axe sürümünde "karar verilemedi" sayısı tabana (21) sığdığı ya da düğümün nedeni
      # ölçülüp taban bilinçli yeniden belirlendiği (Recep kararı) gün.
      - dependency-name: 'axe-core'
        versions: ['>=4.14.1']
      # (Sentry ana sürüm ertelemesi — karar 17 — ALT-46'da kaldırıldı: @sentry/nextjs 11.9.0 kuruldu,
      # kaldırma şartı oluştu. Bot bundan sonra @sentry/* ana sürümlerini normal PR olarak açar.)
      # 3D SINIRI — @react-three/fiber 9.5.0 peer `react '>=19 <19.3'` (2026-09-21 ölçüldü,
      # kayıt §4 react satırı). Bot React'i 19.3'e çekerse 3D sahneleri kırılabilir.
      # KALDIRMA ŞARTI: fiber'ın peer aralığı 19.3'ü kapsadığı gün bu dört satır silinir.
      - dependency-name: 'react'
        versions: ['>=19.3.0']
      - dependency-name: 'react-dom'
        versions: ['>=19.3.0']
      - dependency-name: '@types/react'
        versions: ['>=19.3.0']
      - dependency-name: '@types/react-dom'
        versions: ['>=19.3.0']
      # NEXT 16 = GÖÇ, gevşetme değil — REC-364. Bot'un react-next PR'ı (#1279) Next 16'yı getirdi,
      # CI'da 16 tip hatası (revalidateTag Next 16'da iki argüman). Göç plan-challenger'lı ayrı iş.
      # KALDIRMA ŞARTI: REC-364 kapandığı gün bu iki satır silinir.
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']

  # İş akışlarındaki aksiyonlar — 2026-09-22'den beri SHA + sürüm yorumuyla sabitli (#1307,
  # cetvel §12, INV-AKSIYON-SHA-1); bot SHA'yı ve yorumu birlikte günceller.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: 'chore(ci)'
    # Aksiyonlar SHA + sürüm yorumuyla pinli (§12, INV-AKSIYON-SHA-1); Dependabot ikisini birlikte
    # günceller. Grup YALNIZ küçük/yama sürümleri toplar: ANA sürüm atlaması her aksiyon için ayrı PR
    # gelir — 2026-09-22'de #1278 sekiz ana sürümü tek PR'da getirdi ve ölçülemeden kapatıldı.
    groups:
      aksiyonlar:
        patterns: ['*']
        update-types: [minor, patch]

  # WrongStack MCP araçları — kendi kilit dosyası var (`npm ci --ignore-scripts`, ANA ağaçta).
  # Paketler kilitte bilinçli sabit (şu an 1.0.26); yükseltme ELLE yapılır: yama + kilit + test
  # aynı PR'da (tools/wrongstack-mcp/README.md "yama çıkmazı"). Bot sürüm PR'ı AÇMAZ (aşağıdaki
  # ignore). groups ve tavan 1, ignore kalkarsa devreye girer.
  - package-ecosystem: npm
    directory: /tools/wrongstack-mcp
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 1
    labels: [dependencies]
    commit-message:
      prefix: 'chore(tools)'
    groups:
      wrongstack:
        patterns: ['*']
    ignore:
      # KABUL EDİLMİŞ ERTELEME — OPS kararı 10-09 (karar 224, ARC-76). Bot yalnız package.json ve
      # kilidi değiştirir; yamalar (tools/wrongstack-mcp/yamalar) ve kurulum.cjs'in kilit-yama kapısı
      # gelmez: #1696 (1.0.26 → 1.0.29) bu yüzden ci'da INV-WRONGSTACK-KANBAN-YAMA-1 ve
      # INV-WRONGSTACK-SAGE-YAMA-1'den kırmızı oldu ve birleşemezdi. Her yeni sürüm için aynı kırmızı
      # PR açılır; yükseltme yama + kilit + test birlikte, elle gider. Yeni sürüm görünürlüğü:
      # SessionStart WRONGSTACK satırı ve günlük etiket kontrolü (karar 257).
      # KALDIRMA ŞARTI: WrongStack yükseltmesi yama + kilit + testle birlikte otomatik üretilebildiği
      # (yama çıkmazı README'den kalktığı) gün bu satır silinir.
      - dependency-name: '@wrongstack/*'
