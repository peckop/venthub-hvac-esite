<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Basic SEO: keep these static for first paint -->
  <title>VentHub | HVAC Ürünleri ve Çözümleri</title>
  <meta name="description" content="Endüstriyel havalandırma (HVAC) ürünleri ve çözümlerini keşfedin. Hızlı teslimat, 2 yıl garanti ve uzman desteği." />
  <link rel="canonical" href="/" />

  <!-- Open Graph / Twitter defaults (Seo.tsx bunları dynamic olarak günceller) -->
  <meta property="og:title" content="VentHub" />
  <meta property="og:description" content="HVAC ürünleri ve çözümleri" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/images/hvac_heat_recovery_7.png" />
  <meta property="og:locale" content="tr_TR" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Removed global preconnect/dns-prefetch to avoid unused-preconnect warnings; we will add preconnect at first real Supabase usage if needed. -->
  
  <!-- Fonts: self-hosted via @fontsource/inter; removed external Google Fonts links -->
  <!-- Preload critical fonts -->

  <!-- Preload key LCP image of the hero for faster rendering on homepage only -->
  <!-- Note: to avoid warnings on non-home routes, keep preload only on root path build or remove. Using eager+fetchpriority in HeroSection already covers LCP. -->
  <!-- Removed to prevent preload-not-used warnings across admin routes. -->
  <!-- <link rel="preload" as="image" href="/images/industrial_HVAC_air_handling_unit_warehouse.jpg" fetchpriority="high"> -->
  <!-- You can add more preconnects (e.g., CDN) as needed -->
</head>

<body class="overflow-x-hidden">
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(event) {
      if(event.message === 'ResizeObserver loop completed with undelivered notifications.') return;
      var msg = event.message || event;
      var div = document.createElement('div');
      div.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:red; z-index:99999; padding:20px; font-family:monospace; white-space:pre-wrap; overflow:auto; pointer-events:none;';
      div.innerText = '⚠️ CRITICAL RUNTIME ERROR:\n' + msg + '\n\nStack:\n' + (event.error ? event.error.stack : 'N/A');
      document.body.appendChild(div);
    });
    window.addEventListener('unhandledrejection', function(event) {
      var div = document.createElement('div');
      div.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:orange; z-index:99999; padding:60px 20px 20px 20px; font-family:monospace; white-space:pre-wrap; overflow:auto; pointer-events:none;';
      div.innerText = '⚠️ UNHANDLED PROMISE REJECTION:\n' + event.reason;
      document.body.appendChild(div);
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
