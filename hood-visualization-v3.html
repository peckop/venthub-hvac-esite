<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Hood Visualization V3 (Engineering Correct)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 1;
        }
    </style>
    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">Industrial Hood V3 - Vertical Baffles & Rail System</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 5, 20);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.0, 1.2, 2.5); // Closer inspection angle

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.5, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(5, 5, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0xffaa00, 0.4);
        fillLight.position.set(-2, 0, 2);
        scene.add(fillLight);

        // Materials
        const steelMaterial = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            metalness: 0.85,
            roughness: 0.25,
            side: THREE.DoubleSide
        });

        const filterMaterial = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            metalness: 0.7,
            roughness: 0.3
        });

        // --- V3 HOOD GEOMETRY ---
        const hoodGroup = new THREE.Group();
        scene.add(hoodGroup);

        // Dimensions
        const width = 2.0;
        const depth = 1.1;
        const height = 0.6;
        const thickness = 0.002; // 2mm steel sheet

        // 1. MAIN SHELL (Box)
        // Top
        const topPanel = new THREE.Mesh(new THREE.BoxGeometry(width, thickness, depth), steelMaterial);
        topPanel.position.y = height;
        topPanel.castShadow = true;
        hoodGroup.add(topPanel);

        // Back
        const backPanel = new THREE.Mesh(new THREE.BoxGeometry(width, height, thickness), steelMaterial);
        backPanel.position.set(0, height / 2, -depth / 2 + thickness / 2);
        backPanel.castShadow = true;
        hoodGroup.add(backPanel);

        // Sides
        const sideGeo = new THREE.BoxGeometry(thickness, height, depth);
        const leftPanel = new THREE.Mesh(sideGeo, steelMaterial);
        leftPanel.position.set(-width / 2 + thickness / 2, height / 2, 0);
        for (let k = 0; k < numSlats; k++) {
            const slat = new THREE.Mesh(slatGeo, steelMaterial);
            // Distribute across width of filter
            const sX = (k - (numSlats - 1) / 2) * 0.07;
            slat.position.set(sX, 0, 0);
            f.add(slat);
        }

        // Frame border for realism
        const frameTop = new THREE.Mesh(new THREE.BoxGeometry(fWidth, 0.02, fThick + 0.005), steelMaterial);
        frameTop.position.y = fHeight / 2;
        f.add(frameTop);

        const frameBottom = new THREE.Mesh(new THREE.BoxGeometry(fWidth, 0.02, fThick + 0.005), steelMaterial);
        frameBottom.position.y = -fHeight / 2;
        f.add(frameBottom);

        filterGroup.add(f);
        }

        // 4. EXHAUST DUCT (Hidden in Plenum)
        // Must be behind the filters.
        const ductGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.3, 32);
        const duct = new THREE.Mesh(ductGeo, steelMaterial);
        // Position: Centered X, Y goes up through ceiling, Z is inside plenum
        // Plenum Z range is roughly -depth/2 to topRailZ.
        const plenumCenterZ = (-depth / 2 + topRailZ) / 2;
        duct.position.set(0, height + 0.1, plenumCenterZ);
        hoodGroup.add(duct);


        // 5. LIGHTS
        const lightBar = new THREE.Mesh(new THREE.BoxGeometry(width - 0.2, 0.05, 0.1), steelMaterial);
        lightBar.position.set(0, height - 0.05, depth / 2 - 0.2); // Front overhang
        hoodGroup.add(lightBar);

        const l1 = new THREE.PointLight(0xffffee, 0.8, 3);
        l1.position.set(-0.5, height - 0.1, depth / 2 - 0.2);
        hoodGroup.add(l1);

        const l2 = new THREE.PointLight(0xffffee, 0.8, 3);
        l2.position.set(0.5, height - 0.1, depth / 2 - 0.2);
        hoodGroup.add(l2);

        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.5;
        scene.add(floor);

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            // hoodGroup.rotation.y += 0.002; // Optional rotation
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
